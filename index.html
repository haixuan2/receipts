    wear: 0.03, wearLines: 0, fibres: 0, photo: 'gameboy',
  },
};
for (const k in THEMES) Object.defineProperty(THEMES[k], 'name', { get: () => t('theme.' + k) });
const THEME_ORDER = ['thermal', 'kraft', 'ticket', 'midnight', 'notebook', 'blueprint', 'newsprint', 'gameboy'];

function hash32(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return h >>> 0;
}
function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const CJK = /[⺀-鿿가-힯豈-﫿＀-￯　-ヿ]/;

// Greedy wrap: breaks at spaces, between CJK characters, and inside words too long for a line.
function wrap(ctx, text, maxWidth) {
  const lines = [];
  for (const para of String(text).split('\n')) {
    const tokens = [];
    let word = '';
    for (const ch of Array.from(para)) {
      if (ch === ' ' || CJK.test(ch)) { if (word) { tokens.push(word); word = ''; } tokens.push(ch); }
      else word += ch;
    }
    if (word) tokens.push(word);

    let line = '';
    const push = () => { lines.push(line.replace(/\s+$/, '')); line = ''; };
    for (const tok of tokens) {
      if (ctx.measureText(line + tok).width <= maxWidth) { line += tok; continue; }
      if (line.trim()) push(); else line = '';
      if (tok === ' ') continue;
      if (ctx.measureText(tok).width <= maxWidth) { line = tok; continue; }
      for (const ch of Array.from(tok)) {
        if (line && ctx.measureText(line + ch).width > maxWidth) push();
        line += ch;
      }
    }
    push();
  }
  return lines;
}

// Paper outline. Top and bottom edges depend on the style; ticket stubs get a notch on each side,
// notebook pages get punched holes (added as extra sub-paths and cut out with the even-odd rule).
function paperPath(ctx, T, H, rand, notchY) {
  const PI = Math.PI;
  const n = Math.floor(W / 14), step = W / n;
  ctx.beginPath();
  if (T.top === 'zig') {
    ctx.moveTo(0, 4);
    let up = true;
    for (let x = 5; x <= W; x += 5) { ctx.lineTo(x, up ? 0 : 4); up = !up; }
  } else if (T.top === 'scallop') {
    ctx.moveTo(0, 0);
    for (let i = 0; i < n; i++) { const cx = (i + 0.5) * step; ctx.lineTo(cx - 5, 0); ctx.arc(cx, 0, 5, PI, 0, true); }
    ctx.lineTo(W, 0);
  } else { ctx.moveTo(0, 0); ctx.lineTo(W, 0); }

  if (notchY) { ctx.lineTo(W, notchY - 7); ctx.arc(W, notchY, 7, -PI / 2, PI / 2, true); }

  if (T.bottom === 'zig') {
    let up = false;
    for (let x = W; x >= 0; x -= 5) { ctx.lineTo(x, up ? H : H - 4); up = !up; }
  } else if (T.bottom === 'scallop') {
    ctx.lineTo(W, H);
    for (let i = n - 1; i >= 0; i--) { const cx = (i + 0.5) * step; ctx.lineTo(cx + 5, H); ctx.arc(cx, H, 5, 0, PI, true); }
    ctx.lineTo(0, H);
  } else if (T.bottom === 'flat') {
    ctx.lineTo(W, H); ctx.lineTo(0, H);
  } else {
    ctx.lineTo(W, H - 2);
    let x = W, notch = true;
    while (x > 0) {
      x = Math.max(0, x - 4.5 * (0.8 + rand() * 0.5));
      ctx.lineTo(x, notch ? H - 5 - rand() * 2 : H - rand() * 1.5);
      notch = !notch;
    }
  }

  if (notchY) { ctx.lineTo(0, notchY + 7); ctx.arc(0, notchY, 7, PI / 2, -PI / 2, true); }
  ctx.closePath();

  if (T.holes) {
    for (let hy = 26; hy < H - 14; hy += 30) { ctx.moveTo(16.5, hy); ctx.arc(12, hy, 4.5, 0, PI * 2); }
  }
}

function drawReceipt(r, scale) {
  if (r.kind === 'movie') return drawTicket(r, scale);
  const money = (m) => formatMoney(m, r.currency);
  scale = scale || Math.min(3, Math.max(2, window.devicePixelRatio || 1));
  const T = THEMES[r.style] || THEMES.thermal;
  const F = T.font;
  const SMALL = F === SERIF ? SERIF : MONO; // fine print
  const inner = W - PAD_X * 2;
  const measure = document.createElement('canvas').getContext('2d');
  const ops = [];
  let y = T.padTop;
  let bandBottom = 0;

  const text = (str, font, lineH, align, opts) => {
    opts = opts || {};
    measure.font = font;
    const lines = opts.noWrap ? [str] : wrap(measure, str, opts.width || inner);
    for (const ln of lines) {
      ops.push({ t: 'text', str: ln, font, align, y: y + lineH / 2, spacing: opts.spacing || 0,
        alpha: opts.alpha || 1, color: opts.color || 'ink' });
      y += lineH;
    }
  };
  const rule = () => { ops.push({ t: 'rule', y: y + 0.5 }); y += T.rule === 'double' ? 4 : 1; };
  const bar = (h) => { ops.push({ t: 'bar', y, h }); y += h; };
  const photo = () => { ops.push({ t: 'photo', photo: r.photo, y }); y += photoHeight(T, r.photo, inner); };

  // Header: title, date or date range, optional place, optional photo.
  const onBand = T.band ? 'paper' : 'ink';
  const titleSize = T.titleSize || 22;
  if (T.masthead) { bar(3); y += 3; bar(1); y += 12; }
  text(r.title, 'bold ' + titleSize + 'px ' + F, titleSize + 7, 'center', { color: onBand });
  y += T.band ? 6 : 10;
  text(displayRange(r.purchaseDate, r.endDate), '12px ' + F, 16, 'center', { spacing: 1, noWrap: true, color: onBand, alpha: T.band ? 0.92 : 1 });
  if (T.masthead) { y += 10; bar(1); }
  if (T.band) {
    // Ticket: the header sits on a coloured band that takes the place of the first rule.
    bandBottom = y + 16;
    y = bandBottom + 16;
    if (r.location) { text(r.location, '12px ' + F, 17, 'center'); y += 10; }
    if (r.photo) { photo(); y += 16; }
    y -= 14;
  } else {
    if (r.location) { y += T.masthead ? 10 : 5; text(r.location, '12px ' + F, 17, 'center'); }
    if (r.photo) { y += 18; photo(); }
    y += 20; rule();
  }

  // Line items, grouped under category headings when categories are used.
  // A lone unnamed item is just the total, so the list is skipped.
  const itemised = !(r.items.length === 1 && !r.items[0].name);
  if (itemised) {
    const itemFont = '13px ' + F;
    measure.font = itemFont;
    const amountW = Math.max(...r.items.map((it) => measure.measureText(money(it.amountMinor)).width));
    const nameW = inner - amountW - 12;
    y += 14;
    groupItems(r.items).forEach((g, gi) => {
      if (gi) y += 14;
      if (g.name) {
        if (g.items.length > 1) {
          ops.push({ t: 'text', str: money(g.subtotal), font: '11px ' + F, align: 'right', y: y + 9, spacing: 0, alpha: 0.75, color: 'accent' });
        }
        text(g.name, 'bold 12px ' + F, 18, 'left', { color: 'accent', spacing: 1, noWrap: true });
        y += 4;
      }
      g.items.forEach((it, i) => {
        if (i) y += 7;
        ops.push({ t: 'text', str: money(it.amountMinor), font: itemFont, align: 'right', y: y + 9, spacing: 0, alpha: 1, color: 'ink' });
        text(it.name, itemFont, 18, 'left', { width: nameW });
        // An amount entered as a sum shows its addends, like a till listing each charge.
        if (it.parts && it.parts.length > 1) {
          text(it.parts.map((x) => plainAmount(x, r.currency)).join(' + '), '10.5px ' + SMALL, 14, 'left', { width: nameW, alpha: 0.62 });
        }
      });
    });
    y += 14; rule();
  }

  // Subtotal, tax and tip, when there is tax or tip, as on a restaurant bill.
  if (r.taxMinor || r.tipMinor) {
    y += 14;
    const line = (label, minor) => {
      ops.push({ t: 'text', str: money(minor), font: '13px ' + F, align: 'right', y: y + 9, spacing: 0, alpha: 0.85, color: 'ink' });
      text(label, '13px ' + F, 18, 'left', { alpha: 0.85, noWrap: true });
      y += 4;
    };
    line(t('r.subtotal'), r.subtotalMinor);
    if (r.taxMinor) line(t('r.tax') + (r.taxRate ? ' ' + r.taxRate + '%' : ''), r.taxMinor);
    if (r.tipMinor) line(t('r.tip') + (r.tipRate ? ' ' + r.tipRate + '%' : ''), r.tipMinor);
    y += 6; rule();
  }

  // Total, shrunk if needed so very large sums still fit beside the label.
  y += 18;
  const total = money(r.totalMinor);
  let size = 28;
  for (; size > 16; size--) {
    measure.font = 'bold ' + size + 'px ' + F;
    if (measure.measureText(total).width <= inner - 64) break;
  }
  const totalY = y + 17;
  ops.push({ t: 'text', str: t('r.total'), font: '600 14px ' + F, align: 'left', y: totalY + 2, spacing: 3, alpha: 1, color: 'ink' });
  ops.push({ t: 'text', str: total, font: 'bold ' + size + 'px ' + F, align: 'right', y: totalY, spacing: 0, alpha: 1, color: T.totalColor || 'ink' });
  // Kraft's decorative stamp sits between the label and the amount, moving left for long amounts.
  measure.font = 'bold ' + size + 'px ' + F;
  if (T.stamp) ops.push({ t: 'stamp', x: Math.min(112, W - PAD_X - measure.measureText(total).width - 30), y: totalY - 2 });
  y += 34;

  // Optional split between people.
  if (r.people >= 2) {
    y += 8;
    ops.push({ t: 'text', str: money(shareMinor(r)), font: 'bold 15px ' + F, align: 'right', y: y + 10, spacing: 0, alpha: 1, color: 'ink' });
    // The rounding tag is dropped when it would run into the amount; the line below shows the split anyway.
    const tag = r.rounding === 'up' ? t('r.tagUp') : r.rounding === 'down' ? t('r.tagDown') : '';
    measure.font = 'bold 15px ' + F;
    const shareW = measure.measureText(money(shareMinor(r))).width;
    measure.font = '12px ' + F;
    let label = t('r.perPerson', { n: r.people }) + tag;
    if (measure.measureText(label).width + label.length + shareW + 12 > inner) label = t('r.perPerson', { n: r.people });
    text(label, '12px ' + F, 20, 'left', { spacing: 1, alpha: 0.85, noWrap: true });
    // When the total does not divide evenly, show how it adds up: friends' shares plus the payer's.
    if (r.rounding && shareMinor(r) * r.people !== r.totalMinor) {
      text(t('r.split', { k: r.people - 1, share: money(shareMinor(r)), payer: money(payerMinor(r)) }), '10.5px ' + SMALL, 14, 'right', { alpha: 0.62, noWrap: true });
    }
  }
  // Who owes the payer, two to a row, each with a box that is ticked once they have paid.
  const participants = r.people >= 2 ? participantsOf(r) : [];
  if (participants.length) {
    y += 10;
    const nameFont = '12px ' + F;
    measure.font = nameFont;
    const colW = inner / 2;
    participants.forEach((p, i) => {
      const x = PAD_X + (i % 2) * colW;
      const rowY = y + Math.floor(i / 2) * 22;
      let name = p.name;
      while (name.length > 1 && measure.measureText(name).width > colW - 22) name = name.slice(0, -1);
      if (name !== p.name) name = name.slice(0, -1) + '…';
      ops.push({ t: 'check', x, y: rowY + 5, paid: !!p.paid });
      ops.push({ t: 'text', str: name, font: nameFont, align: 'left', x: x + 17, y: rowY + 10, spacing: 0, alpha: p.paid ? 0.6 : 1, color: 'ink' });
    });
    y += Math.ceil(participants.length / 2) * 22 - 4;
  }
  // Once everyone has paid, a stamp gets its own space under the list so it hides no figures.
  if (isSettled(r)) { y += 16; ops.push({ t: 'settled', x: W / 2, y: y + 24 }); y += 50; }
  y += 18;

  // Getting paid back: a QR code that opens the payment for the per-person amount.
  if (r.pay && PAY_METHODS[r.pay.method]) {
    const m = PAY_METHODS[r.pay.method];
    const link = payLink(r);
    let qr = null;
    if (link && typeof qrcode === 'function') {
      try { qr = qrcode(0, 'M'); qr.addData(link); qr.make(); } catch (e) { qr = null; }
    }
    rule(); y += 18;
    if (qr) {
      text(t('r.scan', { name: m.name }), '600 12px ' + F, 18, 'center', { spacing: 2, noWrap: true });
      y += 10;
      const n = qr.getModuleCount();
      const quiet = 3;
      const mod = Math.max(2, Math.min(5, Math.floor(150 / (n + quiet * 2))));
      const size = (n + quiet * 2) * mod;
      y = Math.round(y);
      ops.push({ t: 'qr', qr, n, mod, quiet, size, x: Math.round((W - size) / 2), y });
      y += size + 10;
      // A receive code (or a link in another currency) carries no amount, so say what to type in.
      if (!payHasAmount(r)) text(t('r.scanEach', { share: money(shareMinor(r)) }), '12px ' + F, 16, 'center', { noWrap: true });
      else text(payDisplay(r.pay) + ' · ' + money(shareMinor(r)), '12px ' + F, 16, 'center', { noWrap: true });
    } else {
      text(t('r.transferTo', { name: m.name }), '600 12px ' + F, 18, 'center', { spacing: 2, noWrap: true });
      y += 4;
      text(payDisplay(r.pay), 'bold 15px ' + F, 20, 'center');
      text(t('r.each', { share: money(shareMinor(r)) }), '12px ' + F, 16, 'center', { noWrap: true, alpha: 0.85 });
    }
    y += 18;
  }

  if (r.note) { rule(); y += 16; text(r.note, '13px ' + F, 20, 'left'); y += 16; }

  // Receipt number, as on a till receipt. The ticket style also prints it under a barcode.
  const no = r.no || receiptNo(r.id, r.createdAt);
  if (T.barcode) {
    y += 6;
    ops.push({ t: 'barcode', y, h: 26 });
    y += 26 + 6;
  } else {
    y += 12;
  }
  text('NO. ' + no + (r.printedAt ? '  ' + r.printedAt : ''), '8.5px ' + MONO, 11, 'center', { spacing: 1.2, alpha: 0.75, noWrap: true });
  y += 6;
  text('PERSONAL RECORD', '500 8.5px ' + SMALL, 11, 'center', { spacing: 2.5, alpha: 0.6, noWrap: true });
  const H = Math.ceil(y + PAD_BOTTOM);

  const canvas = document.createElement('canvas');
  canvas.width = Math.round(W * scale);
  canvas.height = Math.round(H * scale);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  canvas.className = 'receipt';
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);
  const seed = hash32(r.id);
  const rand = rng(seed);

  paperPath(ctx, T, H, rand, bandBottom);
  ctx.clip('evenodd');

  // Paper.
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, T.paper[0]); grad.addColorStop(1, T.paper[1]);
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
  if (T.fibres) {
    for (let i = 0; i < 5; i++) {
      ctx.fillStyle = 'rgba(0,0,0,' + (0.006 + rand() * 0.007) * T.fibres + ')';
      ctx.fillRect(rand() * W, 0, 18 + rand() * 50, H);
    }
    const fibres = Math.floor(W * H / 45);
    for (let i = 0; i < fibres; i++) {
      const dark = rand() < 0.6;
      ctx.fillStyle = dark ? 'rgba(40,20,0,' + (0.02 + rand() * 0.045) * T.fibres + ')' : 'rgba(255,255,255,' + (0.25 + rand() * 0.35) / T.fibres + ')';
      ctx.fillRect(rand() * W, rand() * H, (0.5 + rand() * 1.4) * (T.fibres > 1 ? 2 : 1), 0.5);
    }
  }
  if (T.stars) {
    const stars = Math.floor(W * H / 900);
    for (let i = 0; i < stars; i++) {
      const big = rand() < 0.12;
      ctx.fillStyle = 'rgba(255,250,230,' + (0.12 + rand() * (big ? 0.6 : 0.35)) + ')';
      const s = big ? 1.6 : 0.6 + rand() * 0.6;
      ctx.fillRect(rand() * W, rand() * H, s, s);
    }
  }
  if (T.grid) {
    const line = (x1, y1, x2, y2) => { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); };
    ctx.lineWidth = 1;
    for (let i = 1, gx = T.grid.step; gx < W; gx += T.grid.step, i++) {
      ctx.strokeStyle = T.grid.major && i % T.grid.major === 0 ? T.grid.majorColor : T.grid.color;
      line(gx + 0.5, 0, gx + 0.5, H);
    }
    for (let i = 1, gy = T.grid.step; gy < H; gy += T.grid.step, i++) {
      ctx.strokeStyle = T.grid.major && i % T.grid.major === 0 ? T.grid.majorColor : T.grid.color;
      line(0, gy + 0.5, W, gy + 0.5);
    }
  }
  if (T.frame) {
    ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 1;
    ctx.strokeRect(8.5, 8.5, W - 17, H - 17);
    ctx.strokeRect(11.5, 11.5, W - 23, H - 23);
  }
  if (T.band) {
    ctx.fillStyle = T.band; ctx.fillRect(0, 0, W, bandBottom);
    // Perforation between the stub header and the body.
    ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 1.5; ctx.setLineDash([2, 5]);
    ctx.beginPath(); ctx.moveTo(10, bandBottom - 1); ctx.lineTo(W - 10, bandBottom - 1); ctx.stroke();
    ctx.setLineDash([]);
  }

  // Ink on its own layer so the print can be made slightly uneven.
  const colors = { ink: T.ink, accent: T.accent, paper: T.paper[0] };
  const inkCanvas = document.createElement('canvas');
  inkCanvas.width = canvas.width; inkCanvas.height = canvas.height;
  const ink = inkCanvas.getContext('2d');
  ink.scale(scale, scale);
  ink.textBaseline = 'middle';
  for (const op of ops) {
    ink.globalAlpha = 1;
    ink.setLineDash([]);
    if ('letterSpacing' in ink) ink.letterSpacing = '0px';
    if (op.t === 'rule') {
      ink.strokeStyle = colors[T.ruleColor || 'ink'];
      ink.globalAlpha = T.ruleColor ? 0.7 : 1;
      const line = (yy, w) => { ink.lineWidth = w; ink.beginPath(); ink.moveTo(PAD_X, yy); ink.lineTo(W - PAD_X, yy); ink.stroke(); };
      if (T.rule === 'double') { line(op.y, 1.2); line(op.y + 3, 0.6); }
      else if (T.rule === 'dot') { ink.lineCap = 'round'; ink.setLineDash([0.1, 5]); line(op.y, 1.6); ink.lineCap = 'butt'; }
      else if (T.rule === 'solid') line(op.y, 1);
      else if (T.rule === 'pixel') { ink.setLineDash([2, 2]); line(op.y + 0.5, 2); }
      else { ink.setLineDash([4, 3]); line(op.y, 1); }
      continue;
    }
    if (op.t === 'bar') { ink.fillStyle = T.ink; ink.fillRect(PAD_X, op.y, inner, op.h); continue; }
    if (op.t === 'photo') { paintPhoto(ink, ctx, T, op.photo, PAD_X, op.y, inner, seed); continue; }
    if (op.t === 'qr') continue; // drawn after the ink layer so wear never touches it
    if (op.t === 'check') {
      ink.strokeStyle = T.ink; ink.lineWidth = 1;
      ink.strokeRect(op.x + 0.5, op.y + 0.5, 10, 10);
      if (op.paid) {
        ink.strokeStyle = colors[T.accent === T.ink ? 'ink' : 'accent'];
        ink.lineWidth = 2; ink.lineCap = 'round'; ink.lineJoin = 'round';
        ink.beginPath(); ink.moveTo(op.x + 2, op.y + 5.5); ink.lineTo(op.x + 4.8, op.y + 8.5); ink.lineTo(op.x + 11.5, op.y - 1); ink.stroke();
        ink.lineCap = 'butt'; ink.lineJoin = 'miter';
      }
      continue;
    }
    if (op.t === 'settled') {
      // Rubber stamp: everyone has paid. Red on light papers, the accent colour on dark ones.
      ink.save();
      ink.translate(op.x, op.y); ink.rotate(-0.08);
      ink.globalAlpha = 0.85;
      const c = T.dark ? T.accent : '#c33a24';
      ink.strokeStyle = c; ink.fillStyle = c;
      ink.lineWidth = 2.2; ink.strokeRect(-52, -21, 104, 42);
      ink.lineWidth = 0.8; ink.strokeRect(-48, -17, 96, 34);
      ink.textAlign = 'center';
      ink.font = 'bold 17px ' + SERIF;
      if ('letterSpacing' in ink) ink.letterSpacing = lang === 'zh' ? '4px' : '2px';
      ink.fillText(t('stamp.settled'), 2, -3);
      ink.font = 'bold 7px ' + MONO;
      if ('letterSpacing' in ink) ink.letterSpacing = '3px';
      ink.fillText(t('stamp.settledSub'), 2, 10);
      ink.restore();
      continue;
    }
    if (op.t === 'barcode') {
      // Decorative bars derived from the receipt ID; not a scannable code.
      const bars = rng(seed ^ 0x51ed);
      ink.fillStyle = T.ink;
      let bx = PAD_X + 26;
      while (bx < W - PAD_X - 26) {
        const bw = 1 + Math.floor(bars() * 3);
        if (bx + bw > W - PAD_X - 26) break;
        ink.fillRect(bx, op.y, bw, op.h);
        bx += bw + 1 + Math.floor(bars() * 3);
      }
      continue;
    }
    if (op.t === 'stamp') {
      ink.save();
      ink.translate(op.x, op.y); ink.rotate(-0.24);
      ink.globalAlpha = 0.62; ink.strokeStyle = T.accent; ink.fillStyle = T.accent;
      ink.lineWidth = 2; ink.beginPath(); ink.arc(0, 0, 25, 0, Math.PI * 2); ink.stroke();
      ink.lineWidth = 0.8; ink.beginPath(); ink.arc(0, 0, 21, 0, Math.PI * 2); ink.stroke();
      ink.textAlign = 'center';
      // Chinese: 已付 over a small PAID; English: PAID alone.
      ink.font = 'bold ' + (lang === 'zh' ? 16 : 13) + 'px ' + SERIF; ink.fillText(t('stamp.paid'), 0, lang === 'zh' ? -4 : 4);
      ink.font = 'bold 6.5px ' + SERIF;
      if ('letterSpacing' in ink) ink.letterSpacing = '2px';
      if (lang === 'zh') ink.fillText('PAID', 1, 10);
      ink.restore();
      continue;
    }
    ink.font = op.font;
    if ('letterSpacing' in ink) ink.letterSpacing = op.spacing + 'px';
    ink.globalAlpha = op.alpha;
    ink.fillStyle = colors[op.color];
    ink.textAlign = op.align;
    const tx = op.x !== undefined ? op.x : op.align === 'center' ? W / 2 + op.spacing / 2 : op.align === 'right' ? W - PAD_X : PAD_X;
    ink.fillText(op.str, tx, op.y);
  }
  ink.globalAlpha = 1;
  ink.globalCompositeOperation = 'destination-out';
  for (let ry = 0; ry < H; ry += 2) {
    ink.fillStyle = 'rgba(0,0,0,' + rand() * T.wear + ')';
    ink.fillRect(0, ry, W, 2);
  }
  for (let i = 0; i < T.wearLines; i++) {
    ink.fillStyle = 'rgba(0,0,0,0.3)';
    ink.fillRect(PAD_X + rand() * inner, 0, 0.8, H);
  }
  ctx.drawImage(inkCanvas, 0, 0, W, H);

  // QR codes stay crisp and high-contrast so phones can scan them: dark modules on a light patch
  // (a cream card on dark papers), with a quiet zone that also covers grid lines.
  for (const op of ops) {
    if (op.t !== 'qr') continue;
    ctx.fillStyle = T.dark ? '#fbf8f0' : T.paper[0];
    if (T.dark && ctx.roundRect) { ctx.beginPath(); ctx.roundRect(op.x, op.y, op.size, op.size, 6); ctx.fill(); }
    else ctx.fillRect(op.x, op.y, op.size, op.size);
    ctx.fillStyle = T.dark ? T.paper[1] : T.ink;
    const o = op.quiet * op.mod;
    for (let row = 0; row < op.n; row++) {
      for (let col = 0; col < op.n; col++) {
        if (!op.qr.isDark(row, col)) continue;
        let run = 1;
        while (col + run < op.n && op.qr.isDark(row, col + run)) run++;
        ctx.fillRect(op.x + o + col * op.mod, op.y + o + row * op.mod, run * op.mod, op.mod);
        col += run - 1;
      }
    }
  }

  canvas.setAttribute('role', 'img');
  canvas.setAttribute('aria-label', spokenText(r));
  return canvas;
}

// The movie ticket stub, drawn on a canvas like receipts: poster on top, a perforation with two
// notches, the details, then the stub with the seat in large type. Colours come from the poster.
const TICKET_SERIF = '"Didot", "Bodoni 72", "Bodoni MT", "Songti SC", "STSong", "Noto Serif CJK SC", Georgia, serif';
const TICKET_SANS = SANS;
const ADMIT_WORDS = ['', 'ONE', 'TWO', 'THREE', 'FOUR', 'FIVE', 'SIX', 'SEVEN', 'EIGHT', 'NINE', 'TEN'];

function drawTicket(r, scale) {
  scale = scale || Math.min(3, Math.max(2, window.devicePixelRatio || 1));
  const C = Object.assign({ paper: '#f6f1e7', ink: '#2a2522', muted: '#8a7f72', accent: '#8a5a2b' }, r.colors || {});
  const poster = r.posterId ? posterCache.get(r.posterId) : null;
  const measure = document.createElement('canvas').getContext('2d');
  const PX = 22, inner = W - PX * 2;
  const ops = [];
  const textOp = (str, font, x, y, opts) => ops.push(Object.assign({ t: 'text', str, font, x, y, align: 'left', color: C.ink, spacing: 0 }, opts || {}));

  // Poster, 2:3, inset from the edges.
  const P = { x: 12, y: 12, w: W - 24, h: Math.round((W - 24) * 1.5) };
  let y = P.y + P.h + 24;

  // Title (and original title).
  const titleFont = 'bold 24px ' + TICKET_SERIF;
  measure.font = titleFont;
  for (const ln of wrap(measure, r.title, inner)) { textOp(ln, titleFont, PX, y + 12); y += 30; }
  if (r.titleEn) {
    const f = '600 10px ' + TICKET_SANS;
    measure.font = f;
    for (const ln of wrap(measure, r.titleEn.toUpperCase(), inner - 20)) { textOp(ln, f, PX, y + 6, { color: C.muted, spacing: 1.6 }); y += 15; }
  }

  // Format and language tags.
  const tags = r.formats.concat(r.language ? [r.language] : []);
  if (tags.length) {
    y += 10;
    const f = '600 10.5px ' + TICKET_SANS;
    measure.font = f;
    let x = PX;
    for (const tag of tags) {
      const w = measure.measureText(tag).width + 14;
      if (x + w > W - PX) { x = PX; y += 24; }
      ops.push({ t: 'pill', x, y, w, h: 19, str: tag, font: f });
      x += w + 6;
    }
    y += 19;
  }

  // Details in two columns: date, time, screen, seats.
  const cells = [[t('tk.date'), displayDate(r.purchaseDate), MONO], r.time ? [t('tk.time'), r.time, MONO] : null,
    r.hall ? [t('tk.hall'), r.hall, TICKET_SANS] : null, r.seats.length ? [t('tk.seats'), r.seats.join(' · '), MONO] : null].filter(Boolean);
  y += 18;
  cells.forEach((c, i) => {
    const x = PX + (i % 2) * (inner / 2);
    const rowY = y + Math.floor(i / 2) * 40;
    textOp(c[0], '600 9.5px ' + TICKET_SANS, x, rowY + 5, { color: C.muted, spacing: 1.2 });
    measure.font = '15px ' + c[2];
    let v = c[1];
    while (v.length > 2 && measure.measureText(v).width > inner / 2 - 8) v = v.slice(0, -2) + '…';
    textOp(v, '15px ' + c[2], x, rowY + 24);
  });
  y += Math.ceil(cells.length / 2) * 40;

  if (r.cinema) {
    const f = '11.5px ' + TICKET_SANS;
    measure.font = f;
    for (const ln of wrap(measure, r.cinema, inner)) { textOp(ln, f, PX, y + 6, { color: C.muted }); y += 17; }
  }
  if (r.companions.length) {
    const f = '11.5px ' + TICKET_SANS;
    measure.font = f;
    for (const ln of wrap(measure, t('tk.with', { list: r.companions.join(t('list.sep')) }), inner)) { textOp(ln, f, PX, y + 6); y += 17; }
  }

  // Perforation, then the stub.
  y += 14;
  const perfY = y;
  y += 22;
  const admit = Math.max(1, r.seats.length || r.companions.length + 1);
  const stubTop = y;
  textOp('ADMIT ' + (ADMIT_WORDS[admit] || admit), '700 11px ' + TICKET_SANS, PX, y + 6, { color: C.accent, spacing: 3 });
  textOp(displayDate(r.purchaseDate) + (r.time ? '  ' + r.time : ''), '10.5px ' + MONO, PX, y + 24, { color: C.muted });
  if (r.seats.length) {
    textOp(t('tk.seat'), '600 9px ' + TICKET_SANS, W - PX, y + 4, { align: 'right', color: C.muted, spacing: 1.5 });
    // First seat in large type; any others as a small "+1" after it.
    let right = W - PX;
    if (r.seats.length > 1) {
      const more = '+' + (r.seats.length - 1);
      measure.font = '600 13px ' + MONO;
      textOp(more, '600 13px ' + MONO, right, y + 32, { align: 'right', color: C.muted });
      right -= measure.measureText(more).width + 5;
    }
    textOp(r.seats[0], 'bold 26px ' + MONO, right, y + 28, { align: 'right' });
  }
  y += 48;
  const money = r.priceMinor != null ? formatMoney(r.priceMinor, r.currency) + '  ·  ' : '';
  textOp(money + 'NO. ' + (r.no || receiptNo(r.id, r.createdAt)), '8.5px ' + MONO, PX, y, { color: C.muted, spacing: 0.8 });
  y += 18;
  const H = Math.ceil(y);

  const canvas = document.createElement('canvas');
  canvas.width = Math.round(W * scale);
  canvas.height = Math.round(H * scale);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  canvas.className = 'receipt ticket';
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);

  // Ticket outline: rounded corners, a notch on each side at the perforation, and once the film has
  // been seen, a punched hole in the stub.
  const notch = 9;
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(0, 0, W, H, 14) : ctx.rect(0, 0, W, H);
  ctx.moveTo(notch, perfY); ctx.arc(0, perfY, notch, 0, Math.PI * 2);
  ctx.moveTo(W + notch, perfY); ctx.arc(W, perfY, notch, 0, Math.PI * 2);
  const hole = { x: Math.round(W * 0.6), y: stubTop + 8 };
  if (movieWatched(r)) { ctx.moveTo(hole.x + 7, hole.y); ctx.arc(hole.x, hole.y, 7, 0, Math.PI * 2); }
  ctx.clip('evenodd');
  ctx.fillStyle = C.paper; ctx.fillRect(0, 0, W, H);
  // A faint paper grain, the same for a given ticket.
  const rand = rng(hash32(r.id));
  for (let i = 0; i < W * H / 60; i++) {
    ctx.fillStyle = rand() < 0.5 ? 'rgba(0,0,0,0.035)' : 'rgba(255,255,255,0.25)';
    ctx.fillRect(rand() * W, rand() * H, 1, 0.6);
  }

  // Poster, or the title on the accent colour when there is none.
  ctx.save();
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(P.x, P.y, P.w, P.h, 8) : ctx.rect(P.x, P.y, P.w, P.h);
  ctx.clip();
  if (poster) {
    ctx.drawImage(poster, P.x, P.y, P.w, P.h);
  } else {
    ctx.fillStyle = C.accent; ctx.fillRect(P.x, P.y, P.w, P.h);
    ctx.fillStyle = C.paper; ctx.font = 'bold 30px ' + TICKET_SERIF; ctx.textBaseline = 'alphabetic';
    let ty = P.y + P.h - 24;
    const lines = wrap(ctx, r.title, P.w - 36);
    for (let i = lines.length - 1; i >= 0; i--) { ctx.fillText(lines[i], P.x + 18, ty); ty -= 36; }
  }
  ctx.strokeStyle = 'rgba(0,0,0,0.08)'; ctx.lineWidth = 1;
  ctx.strokeRect(P.x + 0.5, P.y + 0.5, P.w - 1, P.h - 1);
  ctx.restore();

  // Special screening badge on the poster's top-left corner.
  if (r.special) {
    const label = lang === 'zh' ? t('special.' + r.special) + ' · ' + SPECIAL_EN[r.special] : SPECIAL_EN[r.special];
    ctx.font = '700 10px ' + TICKET_SANS;
    if ('letterSpacing' in ctx) ctx.letterSpacing = '1.5px';
    const bw = ctx.measureText(label).width + 18;
    ctx.fillStyle = 'rgba(15,15,15,0.62)';
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(P.x + 10, P.y + 10, bw, 22, 11) : ctx.rect(P.x + 10, P.y + 10, bw, 22); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.textBaseline = 'middle'; ctx.fillText(label, P.x + 19, P.y + 21.5);
    if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
  }

  // Perforation line.
  ctx.strokeStyle = C.muted; ctx.globalAlpha = 0.55; ctx.lineWidth = 1.2; ctx.setLineDash([3, 4]);
  ctx.beginPath(); ctx.moveTo(notch + 6, perfY); ctx.lineTo(W - notch - 6, perfY); ctx.stroke();
  ctx.setLineDash([]); ctx.globalAlpha = 1;

  ctx.textBaseline = 'middle';
  for (const op of ops) {
    if ('letterSpacing' in ctx) ctx.letterSpacing = (op.spacing || 0) + 'px';
    if (op.t === 'pill') {
      ctx.strokeStyle = C.ink; ctx.globalAlpha = 0.7; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.roundRect ? ctx.roundRect(op.x + 0.5, op.y + 0.5, op.w - 1, op.h - 1, 4) : ctx.rect(op.x, op.y, op.w, op.h); ctx.stroke();
      ctx.globalAlpha = 1; ctx.fillStyle = C.ink; ctx.font = op.font; ctx.textAlign = 'center';
      ctx.fillText(op.str, op.x + op.w / 2, op.y + op.h / 2 + 0.5);
      continue;
    }
    ctx.font = op.font; ctx.fillStyle = op.color; ctx.textAlign = op.align;
    ctx.fillText(op.str, op.x, op.y);
  }
  if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';

  canvas.setAttribute('role', 'img');
  canvas.setAttribute('aria-label', movieSpoken(r));
  canvas.dataset.perf = String(perfY);
  canvas.dataset.poster = String(P.y + P.h);
  if (movieWatched(r)) canvas.dataset.hole = hole.x + ',' + hole.y;
  return canvas;
}

// Laser-foil finish for a ticket on screen: a rainbow foil and a light glare over the canvas, both
// following the finger (or mouse) while the ticket tilts in 3D; it springs back when let go. A light
// sweep runs across it once when shown. Images saved from the ticket stay plain.
function holo(canvas, sweep) {
  const foil = el('div', { class: 'holo-foil', 'aria-hidden': 'true' });
  const glare = el('div', { class: 'holo-glare', 'aria-hidden': 'true' });
  // The overlays are cut to the ticket's outline: side notches at the perforation and the punched hole.
  const perf = Number(canvas.dataset.perf) || 0;
  const cuts = ['radial-gradient(circle at 0 ' + perf + 'px, transparent 9px, #000 9.5px)',
    'radial-gradient(circle at 100% ' + perf + 'px, transparent 9px, #000 9.5px)'];
  if (canvas.dataset.hole) {
    const [hx, hy] = canvas.dataset.hole.split(',');
    cuts.push('radial-gradient(circle at ' + hx + 'px ' + hy + 'px, transparent 7px, #000 7.5px)');
  }
  // The foil is lighter over the poster so the artwork keeps its colours.
  const posterEnd = Number(canvas.dataset.poster) || 0;
  const foilCuts = cuts.concat('linear-gradient(to bottom, rgba(0,0,0,.35) 0, rgba(0,0,0,.35) ' + posterEnd + 'px, #000 ' + posterEnd + 'px)');
  for (const [layer, list] of [[foil, foilCuts], [glare, cuts]]) {
    layer.style.webkitMaskImage = layer.style.maskImage = list.join(', ');
    layer.style.webkitMaskComposite = 'source-in';
    layer.style.maskComposite = 'intersect';
  }
  const inner = el('div', { class: 'holo-inner' }, [canvas, foil, glare]);
  const wrap = el('div', { class: 'holo' }, inner);
  const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // The ticket itself never moves (turning it with the phone was dizzying); only the light on it does.
  const setAt = (x, y) => {
    x = Math.min(1, Math.max(0, x)); y = Math.min(1, Math.max(0, y));
    inner.style.setProperty('--mx', (x * 100).toFixed(1) + '%');
    inner.style.setProperty('--my', (y * 100).toFixed(1) + '%');
    inner.style.setProperty('--shine', Math.min(1, Math.hypot(x - 0.5, y - 0.5) * 2.2).toFixed(2));
  };
  const rest = () => { inner.classList.remove('active'); setAt(0.5, 0.5); };
  setAt(0.5, 0.5);

  // On phones the ticket follows the phone's tilt (see the motion code below); fingers just scroll.
  motionTicket = { wrap, update: (x, y) => { if (!inner.classList.contains('sweeping') && !inner.classList.contains('active')) { inner.classList.add('motion'); setAt(x, y); } } };
  // Only touch devices have a tilt sensor worth asking for; desktop browsers may expose the API anyway.
  if (!still && window.matchMedia('(pointer: coarse)').matches) {
    if (needsMotionPermission()) {
      if (!motionOn) wrap.append(el('button', { type: 'button', class: 'motion-btn', text: t('motion.enable'),
        onclick: async (e) => { const b = e.currentTarget; if (await requestMotion()) b.remove(); else { b.remove(); toast(t('motion.denied')); } } }));
    } else startMotion();
  }

  // Computers have no tilt sensor, so there the ticket follows the mouse. The pointer is measured on the
  // outer wrapper, which never tilts; measuring the tilted ticket fed back into the tilt and made it shake.
  wrap.addEventListener('pointermove', (e) => {
    if (e.pointerType !== 'mouse') return;
    const b = wrap.getBoundingClientRect();
    inner.classList.add('active');
    setAt((e.clientX - b.left) / b.width, (e.clientY - b.top) / b.height);
  });
  wrap.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') rest(); });

  // A one-off light sweep from left to right.
  if (sweep && !still) {
    const start = performance.now(), dur = 1400;
    const step = (now) => {
      if (inner.classList.contains('active')) return;
      const k = Math.min(1, (now - start) / dur);
      const ease = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      inner.classList.add('sweeping');
      setAt(0.15 + ease * 0.7, 0.35 + Math.sin(k * Math.PI) * 0.1);
      if (k < 1) requestAnimationFrame(step);
      else { inner.classList.remove('sweeping'); rest(); }
    };
    setTimeout(() => requestAnimationFrame(step), 250);
  }
  return wrap;
}

// Phone tilt. One listener for the app moves whichever ticket is on screen. The neutral position is
// how the phone is held when the ticket appears, and it slowly follows the hand, so only tilting
// relative to that moves the ticket. Readings are smoothed frame by frame.
let motionTicket = null;
let motionOn = false;
const MOTION_KEY = 'receipts.motion.v1';

  let lr = e.gamma, fb = e.beta;
  if (angle === 90) { lr = e.beta; fb = -e.gamma; } else if (angle === 270 || angle === -90) { lr = -e.beta; fb = e.gamma; }
  if (!motion.base) motion.base = { lr, fb };
  motion.base.lr += (lr - motion.base.lr) * 0.01;
  motion.base.fb += (fb - motion.base.fb) * 0.01;
  const clamp = (v) => Math.max(-0.5, Math.min(0.5, v));
  motion.target.x = 0.5 + clamp((lr - motion.base.lr) / 36);
  motion.target.y = 0.5 + clamp((fb - motion.base.fb) / 36);
  if (!motion.raf) motion.raf = requestAnimationFrame(motionTick);
}
function motionTick() {
  motion.raf = 0;
  const m = motionTicket;
  if (!m || !document.contains(m.wrap)) { motion.base = null; return; }
  const c = motion.cur, g = motion.target;
  c.x += (g.x - c.x) * 0.18; c.y += (g.y - c.y) * 0.18;
  m.update(c.x, c.y);

}

}

  } catch (e) { return false; }
  try { localStorage.setItem(MOTION_KEY, '1'); } catch (e) { /* asked again next time */ }

}
// Once allowed, iOS still wants the request made from a tap on each visit; the first tap anywhere does it.
if (needsMotionPermission()) {

  try { allowed = !!localStorage.getItem(MOTION_KEY); } catch (e) { /* no memory of it */ }
  if (allowed) document.addEventListener('click', () => { requestMotion().then((ok) => { if (ok) document.querySelectorAll('.motion-btn').forEach((b) => b.remove()); }); }, { once: true });
}

// Full-length PNG of the whole receipt on a neutral backdrop.
function exportBlob(r) {
  const scale = 3, pad = 28;
  const src = drawReceipt(r, scale);
  const out = document.createElement('canvas');
  out.width = src.width + pad * 2 * scale;
  out.height = src.height + pad * 2 * scale;
  const ctx = out.getContext('2d');
  ctx.fillStyle = '#ededed'; ctx.fillRect(0, 0, out.width, out.height);
  ctx.shadowColor = 'rgba(0,0,0,0.2)'; ctx.shadowBlur = 5 * scale; ctx.shadowOffsetY = 3 * scale;
  ctx.drawImage(src, pad * scale, pad * scale);
  return new Promise((resolve, reject) => out.toBlob((b) => b ? resolve(b) : reject(new Error('export failed')), 'image/png'));
}

function el(tag, attrs, children) {

    else if (k.startsWith('on')) node.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] !== null && attrs[k] !== undefined) node.setAttribute(k, attrs[k]);
  }
  for (const c of [].concat(children || [])) if (c) node.append(c);
  return node;
}
function announce(msg) { $('live').textContent = ''; setTimeout(() => { $('live').textContent = msg; }, 30); }

function refreshMovie() {
  const errors = attempted ? validateMovie(state.movieDraft).errors : {};
  view.querySelectorAll('.error[id^="e-"]').forEach((msg) => {
    const key = msg.id.slice(2);
    const text = errors[key];
    const box = $('f-' + key);
    if (box) box.classList.toggle('invalid', !!text);
    if (text) { msg.textContent = text; msg.hidden = false; } else { msg.hidden = true; msg.textContent = ''; }

// Poster: upload once; it is stored straight away so a reload keeps it, and replaced or removed here.
function renderPosterPick(d) {
  const file = el('input', { type: 'file', accept: 'image/*', id: 'i-mv-poster', 'aria-label': t('mv.posterAdd'),
    onchange: async (e) => {
      const f = e.target.files && e.target.files[0];
      e.target.value = '';
      if (!f) return;
      let p;
      try { p = await posterFromFile(f); } catch (err) { toast(t('toast.posterBad')); return; }
      const id = 'poster-' + ((crypto.randomUUID && crypto.randomUUID()) || Date.now() + '-' + Math.random().toString(16).slice(2));
      try { await putImage(id, p.blob); } catch (err) { toast(t('toast.posterSaveFail')); return; }
      const old = state.movieDraft.posterId;
      patchMovie((n) => { n.posterId = id; n.thumb = p.thumb; n.colors = p.colors; });
      if (old) { deleteImage(old); posterCache.delete(old); }
      renderForm();
    } });
  if (!d.thumb) return el('label', { class: 'poster-pick' }, [file, el('span', { text: t('mv.posterAdd') })]);
  return el('div', { class: 'poster-row' }, [
    el('img', { src: d.thumb, alt: '', class: 'poster-thumb' }),
    el('div', { class: 'poster-actions' }, [
      el('label', { class: 'btn secondary small poster-change' }, [file, t('mv.posterChange')]),
      el('button', { type: 'button', class: 'link quiet', text: t('mv.posterRemove'),
        onclick: () => { const old = d.posterId; patchMovie((n) => { n.posterId = null; n.thumb = null; n.colors = null; }); if (old) { deleteImage(old); posterCache.delete(old); } renderForm(); } }),
    ]),
  ]);
}

function onPrintMovie(e) {
  e.preventDefault();
  if ($('print').disabled) return;
  // Text typed into a chip box but not yet added still counts.
  for (const [id, prop] of [['i-mv-seats', 'seats'], ['i-mv-with', 'companions']]) {
    const v = $(id) && $(id).value.trim();
    if (v) patchMovie((n) => { n[prop] = Array.from(new Set(n[prop].concat(splitNames(v)))); });
  }
  attempted = true;
  const result = validateMovie(state.movieDraft);
  if (!result.input) {
    renderForm();
    const first = Array.from(view.querySelectorAll('.error[id^="e-"]')).find((m) => !m.hidden);
    const target = first && $('i-' + first.id.slice(2));
    if (target) { target.focus(); target.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
    return;
  }
  const button = $('print');
  button.disabled = true;
  button.textContent = t('btn.printing');
  // The poster is already stored; load it so the ticket can be drawn, then save the ticket.
  ensurePoster(result.input.posterId).catch(() => null).then(() => {
    try {
      printed = commitMovie(result.input);
      attempted = false;
      renderStage();
    } catch (err) {
      button.disabled = false;
      button.textContent = t('btn.print');
      $('save-error').textContent = t('save.failed');
      $('save-error').hidden = false;
    }
  });
}

// Adds names to the draft, skipping repeats. If the list outgrows the head count, the count follows.
function addNames(raw, rerender) {
  const add = splitNames(raw);

  if (add.some((n) => len(n) > NAME_MAX)) { toast(t('toast.nameLong', { n: NAME_MAX })); return; }
  patchDraft((x) => {
    x.names = Array.from(new Set((x.names || []).concat(add)));
    const n = /^\d{1,2}$/.test(String(x.people || '').trim()) ? Number(x.people) : 0;
    if (n < x.names.length + 1 && x.names.length + 1 <= 99) x.people = String(x.names.length + 1);
  });
  if (rerender !== false) renderForm('i-names');

// WeChat / Alipay: pick a screenshot of the receive code; it is decoded here and only the code is kept.
function renderCodePick(pay, setPay) {
  const m = PAY_METHODS[pay.method];
  const ok = codeMethod(pay.code) === pay.method;
  const file = el('input', { type: 'file', accept: 'image/*', id: 'i-pay', 'aria-describedby': 'e-pay',
    'aria-label': t(ok ? 'aria.codeChange' : 'aria.codeUpload', { name: m.name }),
    onchange: async (e) => {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      let text = null;
      try { text = await decodeQrFile(f); } catch (err) { text = null; }
      e.target.value = '';
      const found = codeMethod(text);
      if (!found) {
        toast(t(text ? 'toast.notPayCode' : 'toast.noQr'));
        return;
      }
      setPay({ method: found, code: text.trim() });
      if (found !== pay.method) toast(t('toast.switched', { name: PAY_METHODS[found].name }));
      else toast(t('toast.codeOk', { name: m.name }));
      renderForm('i-pay');
    } });
  let preview = null;
  if (ok && typeof qrcode === 'function') {
    try {
      const qr = qrcode(0, 'M'); qr.addData(pay.code); qr.make();
      const n = qr.getModuleCount(), px = 2;
      preview = el('canvas', { width: n * px, height: n * px, 'aria-hidden': 'true', class: 'code-preview' });
      const ctx = preview.getContext('2d');
      ctx.fillStyle = INK;
      for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) ctx.fillRect(c * px, r * px, px, px);
    } catch (err) { preview = null; }
  }
  return el('label', { class: 'code-pick' + (ok ? ' done' : '') }, [
    file, preview, el('span', { text: t(ok ? 'code.done' : 'code.upload') }),
  ]);
}

// Reads a QR code from an image: the browser's own detector where there is one (Chrome, Android),
// otherwise jsQR, loaded only when first needed.
let jsQRLoading = null;
function loadJsQR() {
  if (typeof jsQR === 'function') return Promise.resolve();
  jsQRLoading = jsQRLoading || new Promise((resolve, reject) => {
    const s = el('script', { src: 'vendor/jsQR.js' });
    s.onload = resolve;
    s.onerror = () => { jsQRLoading = null; reject(new Error('jsQR failed to load')); };
    document.head.append(s);
  });
  return jsQRLoading;
}
async function decodeQrFile(file) {
  const img = await loadImage(file);
  const scale = Math.min(1, 1200 / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.max(1, Math.round(img.naturalWidth * scale)), h = Math.max(1, Math.round(img.naturalHeight * scale));
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
  ctx.drawImage(img, 0, 0, w, h);
  if (window.BarcodeDetector) {
    try {
      const found = await new BarcodeDetector({ formats: ['qr_code'] }).detect(c);
      if (found.length) return found[0].rawValue;
    } catch (err) { /* fall through to jsQR */ }
  }
  await loadJsQR();
  const res = jsQR(ctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'attemptBoth' });
  return res ? res.data : null;
}

// Replaces "18.2, 20.1, 5" in an amount field with its sum, remembering the addends for the receipt.
function collapseAmount(i) {
  const it = state.draft.items[i];
  if (!it) return;
  const code = state.draft.currency;
  const a = parseAmount(it.amount, code);
  if (a.error || a.parts.length < 2) return;
  patchItem(i, { amount: plainAmount(a.minor, code), parts: a.parts });
  const input = $('i-item-' + i + '-amount');
  if (input) input.value = plainAmount(a.minor, code);
  refresh();
}

// A new row starts in the previous row's category, so a run of items in one category is quick to enter.
function addItem() {
  const items = state.draft.items;
  if (items.length >= LIMITS.items) return;
  const category = items[items.length - 1].category || '';
  patchDraft((n) => { n.items = n.items.concat({ name: '', amount: '', category, parts: [] }); });
  renderForm('i-item-' + (state.draft.items.length - 1) + '-name');
}

function renderPhoto(d) {
  if (d.photo) {
    const px = 2;
    const c = el('canvas', { width: d.photo.w * px, height: d.photo.h * px, role: 'img', 'aria-label': t('aria.photoPreview') });
    const ctx = c.getContext('2d');
    ctx.fillStyle = INK;
    fillTone(ctx, atkinson(photoGray(d.photo), d.photo.w, d.photo.h, 2), d.photo.w, d.photo.h, 0, 0, 0, px);
    return el('div', { class: 'field' }, el('div', { class: 'photo-preview' }, [

      el('button', { type: 'button', class: 'link quiet', text: t('btn.removePhoto'),

  const file = el('input', { type: 'file', accept: 'image/*', id: 'i-photo', 'aria-label': t('aria.addPhoto'),

// Enter moves through the fields instead of printing, so a long list can be typed quickly.
// In an amount field it first adds up whatever was typed.
function onFormKey(e) {
  if (e.key !== 'Enter' || e.target.tagName !== 'INPUT' || e.isComposing) return;
  e.preventDefault();
  const id = e.target.id;
  const m = /^i-item-(\d+)-(name|amount|category)$/.exec(id);
  if (id === 'i-title') $('i-item-0-name').focus();
  else if (id === 'i-tax') $('i-tip').focus();
  else if (id === 'i-people' || id === 'i-pay' || id === 'i-tip') e.target.blur();
  else if (id === 'i-names') addNames(e.target.value);
  else if (m && m[2] === 'category') e.target.blur();
  else if (m && m[2] === 'name') $('i-item-' + m[1] + '-amount').focus();
  else if (m) {
    const multi = (parseAmount(e.target.value, state.draft.currency).parts || []).length > 1;
    collapseAmount(Number(m[1]));
    if (multi) return; // stay on the field so the computed sum is seen
    const next = $('i-item-' + (Number(m[1]) + 1) + '-name');
    if (next) next.focus();
    else if (e.target.value.trim()) addItem();
  }
}

// Updates errors, hints, the running total and counters in place (no re-render, so focus is kept).
function refresh() {
  const errors = attempted ? validate(state.draft).errors : {};
  view.querySelectorAll('.error[id^="e-"]').forEach((msg) => {
    const key = msg.id.slice(2);
    const box = $('f-' + key);
    const text = errors[key];
    box.classList.toggle('invalid', !!text);
    if (text) { if (msg.textContent !== text) msg.textContent = text; msg.hidden = false; }
    else { msg.hidden = true; msg.textContent = ''; }
    box.querySelectorAll('input, textarea').forEach((i) => {
      if (text) i.setAttribute('aria-invalid', 'true'); else i.removeAttribute('aria-invalid');
    });
  });

  const d = state.draft;
  const code = d.currency;
  const money = (m) => formatMoney(m, code);
  let total = 0;
  d.items.forEach((it, i) => {
    const a = parseAmount(it.amount, code);
    if (!a.error) total += a.minor;
    const hint = $('h-item-' + i);
    if (!hint) return;
    // While a sum is being typed show its result; once collapsed show what it was made of.
    if (!a.error && a.parts.length > 1) hint.textContent = '= ' + money(a.minor);
    else if (!a.error && it.parts && it.parts.length > 1 && it.parts.reduce((x, y) => x + y, 0) === a.minor) {
      hint.textContent = it.parts.map((x) => plainAmount(x, code)).join(' + ');
    } else hint.textContent = '';
  });
  // Tax and tip on top of the items' subtotal; the breakdown lines show only when used.
  const subtotal = total;
  const tax = parseExtra(d.tax, subtotal, 30, code), tip = parseExtra(d.tip, subtotal, 100, code);
  total = subtotal + (tax.minor || 0) + (tip.minor || 0);
  const hasExtras = !!((tax.minor || 0) + (tip.minor || 0));
  const sumLine = (key, show, label, minor) => {
    if (!$('sum-' + key)) return;
    $('sum-' + key).hidden = !show;
    if (label) $('sum-' + key + '-label').textContent = label;
    $('sum-' + key + '-amt').textContent = money(minor || 0);
  };
  sumLine('sub', hasExtras, null, subtotal);
  sumLine('tax', !!tax.minor, t('r.tax') + (tax.rate ? ' ' + tax.rate + '%' : ''), tax.minor);
  sumLine('tip', !!tip.minor, t('r.tip') + (tip.rate ? ' ' + tip.rate + '%' : ''), tip.minor);
  if ($('grand-total')) $('grand-total').textContent = money(total);
  view.querySelectorAll('.presets button').forEach((b) => b.setAttribute('aria-pressed',
    String(String(d[b.parentNode.dataset.field] || '').replace(/\s/g, '') === b.textContent)));

  if ($('per-person')) {
    const n = /^\d{1,2}$/.test(String(d.people || '').trim()) ? Number(d.people) : 0;
    const share = splitShare(total, n, d.rounding || 'cent', code);
    $('per-person').textContent = n >= 2 ? money(share) : '—';
    // How an uneven split adds up; the rounding choice only matters when shares aren't whole units.
    $('h-split').textContent = n >= 2 && share * n !== total
      ? t('hint.split', { k: n - 1, share: money(share), payer: money(total - share * (n - 1)) }) : '';
    $('f-rounding').hidden = !(n >= 2 && total % (n * roundUnit(code)) !== 0);
    view.querySelectorAll('#f-rounding button').forEach((b) => b.setAttribute('aria-checked', String(b.dataset.mode === (d.rounding || 'cent'))));
  }
  const counter = $('note-count');
  if (counter) {
    const n = len(state.draft.note);
    counter.textContent = n + '/' + LIMITS.note;
    counter.classList.toggle('over', n > LIMITS.note);
  }
}

function onPrint(e) {
  e.preventDefault();
  if ($('print').disabled) return;
  // A name typed but not yet turned into a chip still counts (re-render so the chip and head count show).
  const pendingName = $('i-names') ? $('i-names').value.trim() : '';
  if (pendingName) { addNames(pendingName, false); renderForm(); }
  const button = $('print');
  attempted = true;
  $('save-error').hidden = true;

  const result = validate(state.draft);
  if (!result.input) {
    if ((result.errors.location || result.errors.note) && !showMore) { showMore = true; renderForm(); }
    refresh();
    const first = Array.from(view.querySelectorAll('.error[id^="e-"]')).find((m) => !m.hidden);
    const key = first.id.slice(2);
    const target = $('i-' + key + (result.focus[key] ? '-' + result.focus[key] : ''));
    target.focus();
    target.scrollIntoView({ block: 'center', behavior: 'smooth' });
    return;
  }

  // Lock the button right away; the write happens on the next tick so the locked state paints first.
  button.disabled = true;
  button.textContent = t('btn.printing');
  setTimeout(() => {
    try {
      printed = commit(result.input);
      attempted = false;
      showMore = false;
      showExtras = false;
      customRows.clear();
      renderStage();
    } catch (err) {
      button.disabled = false;
      button.textContent = t('btn.print');
      const msg = $('save-error');
      msg.textContent = t('save.failed');
      msg.hidden = false;
    }
  }, 0);
}

/* Print stage: only shown after the receipt is already saved. */

function renderStage() {
  setChrome('', 'new');
  const receipt = printed;
  const canvas = drawReceipt(receipt);
  const feed = el('div', { class: 'feed' }, canvas);
  const viewIt = () => { printed = null; location.hash = '#/r/' + receipt.id; };
  const after = el('div', { class: 'after' }, [
    el('p', { text: t('stage.done') }),
    receipt.people >= 2 ? el('div', { class: 'copy' }, [
      el('button', { type: 'button', class: 'link', text: t('btn.saveImage'), onclick: () => saveImage(receipt) }),
      el('span', { text: '  ·  ', 'aria-hidden': 'true', style: 'color:var(--muted)' }),
      el('button', { type: 'button', class: 'link', text: t('btn.copyText'), onclick: () => copyChatText(receipt) }),
    ]) : null,
    el('div', { class: 'row' }, [
      el('button', { class: 'btn secondary', text: t('btn.view'), onclick: viewIt }),
      el('button', { class: 'btn', text: t('btn.again'), onclick: () => { printed = null; renderForm(); window.scrollTo(0, 0); } }),
    ]),
  ]);
  view.replaceChildren(el('div', { class: 'stage' }, [el('div', { class: 'slot', 'aria-hidden': 'true' }), feed, after]));
  window.scrollTo(0, 0);

  // Longer receipts take a little longer to feed, within the 0.8–1.2 s target.
  const seconds = Math.min(1.2, Math.max(0.8, parseFloat(canvas.style.height) / 500));
  feed.style.setProperty('--feed', seconds + 's');

  let finished = false;
  const done = () => {
    if (finished) return;
    finished = true;
    feed.classList.add('done');
    after.classList.add('show');
    if (receipt.kind === 'movie') feed.replaceChildren(holo(canvas, true));
    else canvas.addEventListener('click', viewIt);
    announce(t('stage.saved'));
  };
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    feed.classList.add('instant');
    done();
  } else {
    requestAnimationFrame(() => requestAnimationFrame(() => feed.classList.add('go')));
    canvas.addEventListener('transitionend', done);
    setTimeout(done, seconds * 1000 + 400); // safety net if the tab was hidden during the feed
  }
}

/* Keeping data safe */

// Ask the browser not to clear this site's storage under pressure. Silent: no prompt in Safari or
// Chrome; it is granted or not from how the site is used. Asked at most once per visit.
let persistAsked = false;
function requestPersist() {
  if (persistAsked || !(navigator.storage && navigator.storage.persist)) return;
  persistAsked = true;
  navigator.storage.persisted().then((yes) => yes || navigator.storage.persist()).catch(() => {});
}

// Posters no ticket (or the movie draft) refers to: uploaded but never printed, or left by an
// interrupted delete. Removed shortly after the app opens.
async function cleanupPosters() {
  try {
    const keys = await idb('readonly', (st) => st.getAllKeys());
    const used = new Set(state.receipts.map((r) => r.posterId).filter(Boolean));
    if (state.movieDraft && state.movieDraft.posterId) used.add(state.movieDraft.posterId);
    for (const k of keys || []) if (!used.has(k)) deleteImage(k);
  } catch (e) { /* IndexedDB unavailable: nothing to clean */ }
}

// Opening from the Home Screen keeps Safari from clearing the data after a week without visits.
const HOME_HINT_KEY = 'receipts.homehint.v1';
function isStandalone() {
  return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
}
function homeHint() {
  let dismissed = false;
  try { dismissed = !!localStorage.getItem(HOME_HINT_KEY); } catch (e) { dismissed = true; }
  if (dismissed || isStandalone() || !state.receipts.length) return null;
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const card = el('section', { class: 'card hint-card' }, [
    el('div', { class: 'card-head' }, [
      el('h2', { text: t('home.title') }),
      el('button', { type: 'button', class: 'icon-btn', 'aria-label': t('home.dismiss'), text: '×',
        onclick: () => { try { localStorage.setItem(HOME_HINT_KEY, '1'); } catch (e) { /* this visit only */ } card.remove(); } }),
    ]),
    el('p', { text: t(ios ? 'home.ios' : 'home.other') }),
  ]);
  return card;
}

/* Backup: every receipt and ticket, with posters, in one JSON file. Restoring adds what is missing
   and never overwrites or deletes what is already here. */
const BACKUP_KEY = 'receipts.backup.v1';
function lastBackupAt() {
  try { return Number(localStorage.getItem(BACKUP_KEY)) || 0; } catch (e) { return 0; }
}
function backupCard() {
  const last = lastBackupAt();
  const newer = state.receipts.filter((r) => r.createdAt > last).length;
  const d = new Date(last);
  const when = last ? d.getFullYear() + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0') : '';
  const status = !state.receipts.length ? t('backup.restoreOnly')
    : !last ? t('backup.never')
    : newer ? t('backup.newer', { when, n: newer }) : t('backup.last', { when });
  const file = el('input', { type: 'file', accept: '.json,application/json', 'aria-label': t('backup.import'),
    onchange: (e) => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) importBackup(f); } });
  return el('section', { class: 'card backup-card' }, [
    el('div', { class: 'card-head' }, el('h2', { text: t('backup.title') })),
    el('p', { class: 'backup-status' + (state.receipts.length && (!last || newer) ? ' due' : ''), text: status }),
    el('div', { class: 'actions' }, [
      state.receipts.length ? el('button', { class: 'btn small', text: t('backup.export'), onclick: exportBackup }) : null,
      el('label', { class: 'btn secondary small file-btn' }, [file, t('backup.import')]),
    ]),
  ]);
}

const blobToDataURL = (blob) => new Promise((resolve, reject) => {
  const fr = new FileReader();
  fr.onload = () => resolve(fr.result);
  fr.onerror = () => reject(fr.error);
  fr.readAsDataURL(blob);
});

// Phones get the share sheet (Save to Files, AirDrop, …); elsewhere the file downloads.
async function saveFile(blob, name, doneMsg) {
  const file = new File([blob], name, { type: blob.type });
  if (window.matchMedia('(pointer: coarse)').matches && navigator.canShare && navigator.canShare({ files: [file] })) {
    await navigator.share({ files: [file] });
    return;
  }
  const url = URL.createObjectURL(blob);
  const a = el('a', { href: url, download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  if (doneMsg) toast(doneMsg);
}

async function exportBackup() {
  try {
    const images = {};
    for (const r of state.receipts) {
      if (!r.posterId || images[r.posterId]) continue;
      const blob = await getImage(r.posterId).catch(() => null);
      if (blob) images[r.posterId] = await blobToDataURL(blob);
    }
    const data = { app: 'receipts', version: 1, exportedAt: Date.now(), receipts: state.receipts, images };
    const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
    await saveFile(blob, t('backup.file') + '-' + todayISO() + '.json', t('backup.saved'));
    try { localStorage.setItem(BACKUP_KEY, String(Date.now())); } catch (e) { /* not critical */ }
    if (location.hash === '#/receipts') renderList();
  } catch (err) {
    if (err && err.name === 'AbortError') return;
    toast(t('backup.exportFail'));
  }
}

async function importBackup(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch (e) { data = null; }
  if (!data || data.app !== 'receipts' || !Array.isArray(data.receipts)) { toast(t('backup.badFile')); return; }
  const have = new Set(state.receipts.map((r) => r.id));
  const add = [];
  for (const raw of data.receipts) {
    if (!raw || typeof raw.id !== 'string' || have.has(raw.id) || typeof raw.purchaseDate !== 'string') continue;
    const r = upgradeReceipt(raw);
    if (r.posterId) {
      const src = data.images && data.images[r.posterId];
      try {
        if (typeof src === 'string' && src.startsWith('data:image/')) await putImage(r.posterId, await (await fetch(src)).blob());
        else r.posterId = null;
      } catch (e) { r.posterId = null; }
    }
    add.push(r);
    have.add(r.id);
  }
  const skipped = data.receipts.length - add.length;
  if (!add.length) { toast(t('backup.nothing')); return; }
  try {
    write({ receipts: sorted(state.receipts.concat(add)) });
  } catch (e) { toast(t('backup.importFail')); return; }
  thumbs.clear();
  toast(skipped ? t('backup.restoredSkip', { n: add.length, m: skipped }) : t('backup.restored', { n: add.length }));
  if (location.hash === '#/receipts') renderList(); else location.hash = '#/receipts';
}

// Payment tracking: tick people off as their transfers arrive. Names can also be added here,
// for a receipt printed before everyone's name was known.
function renderProgress(r) {
  const ps = participantsOf(r);
  const owed = owedCount(r);
  const paid = ps.filter((p) => p.paid).length;
  const save = (participants, msg) => {
    const wasSettled = isSettled(r);
    try { updateReceipt(r.id, { participants: participants.length ? participants : null }); }
    catch (err) { toast(t('toast.saveFail')); return; }
    const now = state.receipts.find((x) => x.id === r.id);
    renderDetail(r.id, true);
    if (!wasSettled && isSettled(now)) toast(t('toast.settled'));
    else if (msg) announce(msg);
  };
  const addFrom = (input) => {
    const add = splitNames(input.value).filter((n) => !ps.some((p) => p.name === n));
    if (!add.length) { input.value = ''; return; }
    if (add.some((n) => len(n) > NAME_MAX)) { toast(t('toast.nameLong', { n: NAME_MAX })); return; }
    if (ps.length + add.length > owed) { toast(t('toast.maxNames', { owed, people: r.people })); return; }
    save(ps.concat(add.map((name) => ({ name, paid: false }))));
    const again = $('add-name'); if (again) again.focus();
  };

  const rows = ps.map((p, i) => el('li', { class: 'pg-row' + (p.paid ? ' paid' : '') }, [
    el('button', { type: 'button', class: 'pg-check', role: 'checkbox', 'aria-checked': String(!!p.paid), 'aria-label': t('aria.paid', { name: p.name }),
      onclick: () => save(ps.map((x, j) => j === i ? Object.assign({}, x, { paid: !x.paid, paidAt: !x.paid ? Date.now() : null }) : x),
        t(p.paid ? 'ann.unpaid' : 'ann.paid', { name: p.name })) }, [
      el('span', { class: 'box-mark', 'aria-hidden': 'true' }),
      el('span', { class: 'pg-name', text: p.name }),
      el('span', { class: 'pg-amt', text: p.paid ? t('pg.paid') : formatMoney(shareMinor(r), r.currency) }),
    ]),
    el('button', { type: 'button', class: 'pg-remove', 'aria-label': t('aria.removeFromList', { name: p.name }), text: '×',
      onclick: () => save(ps.filter((_, j) => j !== i), t('ann.removed', { name: p.name })) }),
  ]));

  const left = owed - ps.length;
  const input = el('input', { id: 'add-name', type: 'text', autocomplete: 'off', enterkeyhint: 'done', 'aria-label': t('aria.addName'),
    placeholder: ps.length ? t('pg.phLeft', { n: left }) : t('pg.ph'),
    onkeydown: (e) => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); addFrom(e.target); } } });
  const suggestions = left > 0 ? recentNames().filter((n) => !ps.some((p) => p.name === n)).slice(0, 8) : [];

  return el('section', { class: 'card progress', 'aria-label': t('pg.title') }, [
    el('div', { class: 'pg-head' }, [
      el('b', { text: t('pg.title') }),
      el('span', { text: ps.length ? t('pg.status', { paid, owed, amt: formatMoney(paid * shareMinor(r), r.currency) }) : t('pg.waiting', { n: owed }) }),
    ]),
    rows.length ? el('ul', { class: 'pg-list' }, rows) : null,
    left > 0 ? el('div', { class: 'pg-add' }, [
      el('div', { class: 'box' }, input),
      el('button', { type: 'button', class: 'btn secondary small', text: t('btn.add'), onclick: () => addFrom(input) }),
    ]) : null,
    suggestions.length ? el('div', { class: 'suggest' }, suggestions.map((n) =>
      el('button', { type: 'button', text: '+ ' + n, onclick: () => { input.value = n; addFrom(input); } }))) : null,
  ]);
}

document.addEventListener('click', () => document.querySelectorAll('.menu').forEach((m) => { m.hidden = true; }));

async function saveImage(r) {
  try {
    if (r.kind === 'movie') await ensurePoster(r.posterId).catch(() => null);
    const blob = await exportBlob(r);
    await saveFile(blob, t('file.prefix') + '-' + r.purchaseDate + '.png', t('toast.imgSaved'));
  } catch (err) {
    if (err && err.name === 'AbortError') return;
    toast(t('toast.imgFail'));
  }
}

// A message to paste into the group chat next to the receipt image, with the payment link to tap.
function chatText(r) {
  const lines = [r.title + ' · ' + displayRange(r.purchaseDate, r.endDate)];
  const money = (m) => formatMoney(m, r.currency);
  const extras = [r.taxMinor ? t('chat.tax') : '', r.tipMinor ? t('chat.tip') : ''].filter(Boolean).join(t('chat.and'));
  lines.push(t('chat.total', { total: money(r.totalMinor) }) + (extras ? t('chat.incl', { what: extras }) : '') +
    (r.people >= 2 ? t('chat.split', { n: r.people, share: money(shareMinor(r)) }) +
      (r.rounding === 'up' ? t('chat.up') : r.rounding === 'down' ? t('chat.down') : '') : ''));
  // Before anyone pays it lists the group; after that it says who is still due.
  const ps = r.people >= 2 ? participantsOf(r) : [];
  const unpaid = ps.filter((p) => !p.paid).map((p) => p.name);
  const sep = t('list.sep');
  if (isSettled(r)) { lines.push(t('chat.settled')); return lines.join('\n'); }
  if (ps.length && unpaid.length === ps.length) lines.push(t('chat.names', { list: unpaid.join(sep) }));
  else if (ps.length) {
    const left = owedCount(r) - ps.length;
    lines.push(t('chat.owing', { list: unpaid.concat(left > 0 ? [t('chat.more', { n: left })] : []).join(sep) }));
  }
  if (r.pay && PAY_METHODS[r.pay.method]) {
    const link = payLink(r);
    const name = PAY_METHODS[r.pay.method].name;
    // A WeChat code is not a link anyone can tap; it is read from the receipt image instead.
    if (r.pay.method === 'wechat') lines.push(t('chat.wechat'));
    else lines.push(link ? t('chat.payLink', { name, link }) : t('chat.payTo', { name, acct: payDisplay(r.pay) }));
  }
  return lines.join('\n');
}

async function copyChatText(r) {
  const str = chatText(r);
  try {
    await navigator.clipboard.writeText(str);
  } catch (err) {
    // Older browsers or no clipboard permission: copy through a hidden text area.
    const ta = el('textarea', { readonly: '', style: 'position:fixed;top:0;left:0;opacity:0' });
    ta.value = str;
    document.body.append(ta); ta.select();
    const ok = document.execCommand && document.execCommand('copy');
    ta.remove();
    if (!ok) { toast(t('toast.copyFail')); return; }
  }
  toast(t('toast.copied'));
}

function confirmDelete(r) {
  const dialog = $('confirm');
  $('confirm-cancel').onclick = () => dialog.close();
  $('confirm-ok').onclick = () => {
    dialog.close();
    try { removeReceipt(r.id); location.hash = '#/receipts'; }
    catch (err) { toast(t('toast.delFail')); }
  };
  dialog.showModal();
}

/* Router */

function route() {
  const hash = location.hash;
  if (hash.startsWith('#/r/')) return renderDetail(decodeURIComponent(hash.slice(4)));
  if (hash === '#/receipts') return renderList();
  if (printed) return renderStage();
  renderForm();
}
applyStatic();
window.addEventListener('hashchange', route);
// Another tab changed the data: pick it up.
window.addEventListener('storage', (e) => {
  if (e.key !== KEY) return;
  state = loadState(); thumbs.clear();
  if (location.hash === '#/receipts' || location.hash.startsWith('#/r/')) route();
});
route();
if (state.receipts.length) requestPersist();
setTimeout(cleanupPosters, 1500);

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
