    }
    rule(); y += 18;
    if (qr) {
      text('扫码付款 · ' + m.name, '600 12px ' + F, 18, 'center', { spacing: 2, noWrap: true });
      y += 10;
      const n = qr.getModuleCount();
      const quiet = 3;
      const mod = Math.max(2, Math.min(5, Math.floor(150 / (n + quiet * 2))));
      const size = (n + quiet * 2) * mod;
      y = Math.round(y);
      ops.push({ t: 'qr', qr, n, mod, quiet, size, x: Math.round((W - size) / 2), y });
      y += size + 10;
      // A receive code carries no amount, so say what to type in.
      if (m.code) text('每人 ' + formatMoney(shareMinor(r)) + ' · 扫码后输入金额', '12px ' + F, 16, 'center', { noWrap: true });
      else text(payDisplay(r.pay) + ' · ' + formatMoney(shareMinor(r)), '12px ' + F, 16, 'center', { noWrap: true });
    } else {
      text(m.name + ' 转账至', '600 12px ' + F, 18, 'center', { spacing: 2, noWrap: true });
      y += 4;
      text(payDisplay(r.pay), 'bold 15px ' + F, 20, 'center');
      text('每人 ' + formatMoney(shareMinor(r)), '12px ' + F, 16, 'center', { noWrap: true, alpha: 0.85 });
    }
    y += 18;
  }

  if (r.note) { rule(); y += 16; text(r.note, '13px ' + F, 20, 'left'); y += 16; }

  // Receipt number, as on a till receipt. The ticket style also prints it under a barcode.
  const no = r.no || receiptNo(r.id, r.createdAt);
  if (T.barcode) {
    y += 6;
    ops.push({ t: 'barcode', y, h: 26 });
    y += 26 + 6;
  } else {
    y += 12;
  }
  text('NO. ' + no + (r.printedAt ? '  ' + r.printedAt : ''), '8.5px ' + MONO, 11, 'center', { spacing: 1.2, alpha: 0.75, noWrap: true });
  y += 6;
  text('PERSONAL RECORD', '500 8.5px ' + SMALL, 11, 'center', { spacing: 2.5, alpha: 0.6, noWrap: true });
  const H = Math.ceil(y + PAD_BOTTOM);

  const canvas = document.createElement('canvas');
  canvas.width = Math.round(W * scale);
  canvas.height = Math.round(H * scale);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  canvas.className = 'receipt';
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);
  const seed = hash32(r.id);
  const rand = rng(seed);

  paperPath(ctx, T, H, rand, bandBottom);
  ctx.clip('evenodd');

  // Paper.
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, T.paper[0]); grad.addColorStop(1, T.paper[1]);
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
  if (T.fibres) {
    for (let i = 0; i < 5; i++) {
      ctx.fillStyle = 'rgba(0,0,0,' + (0.006 + rand() * 0.007) * T.fibres + ')';
      ctx.fillRect(rand() * W, 0, 18 + rand() * 50, H);
    }
    const fibres = Math.floor(W * H / 45);
    for (let i = 0; i < fibres; i++) {
      const dark = rand() < 0.6;
      ctx.fillStyle = dark ? 'rgba(40,20,0,' + (0.02 + rand() * 0.045) * T.fibres + ')' : 'rgba(255,255,255,' + (0.25 + rand() * 0.35) / T.fibres + ')';
      ctx.fillRect(rand() * W, rand() * H, (0.5 + rand() * 1.4) * (T.fibres > 1 ? 2 : 1), 0.5);
    }
  }
  if (T.stars) {
    const stars = Math.floor(W * H / 900);
    for (let i = 0; i < stars; i++) {
      const big = rand() < 0.12;
      ctx.fillStyle = 'rgba(255,250,230,' + (0.12 + rand() * (big ? 0.6 : 0.35)) + ')';
      const s = big ? 1.6 : 0.6 + rand() * 0.6;
      ctx.fillRect(rand() * W, rand() * H, s, s);
    }
  }
  if (T.grid) {
    const line = (x1, y1, x2, y2) => { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); };
    ctx.lineWidth = 1;
    for (let i = 1, gx = T.grid.step; gx < W; gx += T.grid.step, i++) {
      ctx.strokeStyle = T.grid.major && i % T.grid.major === 0 ? T.grid.majorColor : T.grid.color;
      line(gx + 0.5, 0, gx + 0.5, H);
    }
    for (let i = 1, gy = T.grid.step; gy < H; gy += T.grid.step, i++) {
      ctx.strokeStyle = T.grid.major && i % T.grid.major === 0 ? T.grid.majorColor : T.grid.color;
      line(0, gy + 0.5, W, gy + 0.5);
    }
  }
  if (T.frame) {
    ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 1;
    ctx.strokeRect(8.5, 8.5, W - 17, H - 17);
    ctx.strokeRect(11.5, 11.5, W - 23, H - 23);
  }
  if (T.band) {
    ctx.fillStyle = T.band; ctx.fillRect(0, 0, W, bandBottom);
    // Perforation between the stub header and the body.
    ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 1.5; ctx.setLineDash([2, 5]);
    ctx.beginPath(); ctx.moveTo(10, bandBottom - 1); ctx.lineTo(W - 10, bandBottom - 1); ctx.stroke();
    ctx.setLineDash([]);
  }

  // Ink on its own layer so the print can be made slightly uneven.
  const colors = { ink: T.ink, accent: T.accent, paper: T.paper[0] };
  const inkCanvas = document.createElement('canvas');
  inkCanvas.width = canvas.width; inkCanvas.height = canvas.height;
  const ink = inkCanvas.getContext('2d');
  ink.scale(scale, scale);
  ink.textBaseline = 'middle';
  for (const op of ops) {
    ink.globalAlpha = 1;
    ink.setLineDash([]);
    if ('letterSpacing' in ink) ink.letterSpacing = '0px';
    if (op.t === 'rule') {
      ink.strokeStyle = colors[T.ruleColor || 'ink'];
      ink.globalAlpha = T.ruleColor ? 0.7 : 1;
      const line = (yy, w) => { ink.lineWidth = w; ink.beginPath(); ink.moveTo(PAD_X, yy); ink.lineTo(W - PAD_X, yy); ink.stroke(); };
      if (T.rule === 'double') { line(op.y, 1.2); line(op.y + 3, 0.6); }
      else if (T.rule === 'dot') { ink.lineCap = 'round'; ink.setLineDash([0.1, 5]); line(op.y, 1.6); ink.lineCap = 'butt'; }
      else if (T.rule === 'solid') line(op.y, 1);
      else if (T.rule === 'pixel') { ink.setLineDash([2, 2]); line(op.y + 0.5, 2); }
      else { ink.setLineDash([4, 3]); line(op.y, 1); }
      continue;
    }
    if (op.t === 'bar') { ink.fillStyle = T.ink; ink.fillRect(PAD_X, op.y, inner, op.h); continue; }
    if (op.t === 'photo') { paintPhoto(ink, ctx, T, op.photo, PAD_X, op.y, inner, seed); continue; }
    if (op.t === 'qr') continue; // drawn after the ink layer so wear never touches it
    if (op.t === 'check') {
      ink.strokeStyle = T.ink; ink.lineWidth = 1;
      ink.strokeRect(op.x + 0.5, op.y + 0.5, 10, 10);
      if (op.paid) {
        ink.strokeStyle = colors[T.accent === T.ink ? 'ink' : 'accent'];
        ink.lineWidth = 2; ink.lineCap = 'round'; ink.lineJoin = 'round';
        ink.beginPath(); ink.moveTo(op.x + 2, op.y + 5.5); ink.lineTo(op.x + 4.8, op.y + 8.5); ink.lineTo(op.x + 11.5, op.y - 1); ink.stroke();
        ink.lineCap = 'butt'; ink.lineJoin = 'miter';
      }
      continue;
    }
    if (op.t === 'settled') {
      // Rubber stamp: everyone has paid. Red on light papers, the accent colour on dark ones.
      ink.save();
      ink.translate(op.x, op.y); ink.rotate(-0.08);
      ink.globalAlpha = 0.85;
      const c = T.dark ? T.accent : '#c33a24';
      ink.strokeStyle = c; ink.fillStyle = c;
      ink.lineWidth = 2.2; ink.strokeRect(-52, -21, 104, 42);
      ink.lineWidth = 0.8; ink.strokeRect(-48, -17, 96, 34);
      ink.textAlign = 'center';
      ink.font = 'bold 17px ' + SERIF;
      if ('letterSpacing' in ink) ink.letterSpacing = '4px';
      ink.fillText('已结清', 2, -3);
      ink.font = 'bold 7px ' + MONO;
      if ('letterSpacing' in ink) ink.letterSpacing = '3px';
      ink.fillText('ALL SETTLED', 2, 10);
      ink.restore();
      continue;
    }
    if (op.t === 'barcode') {
      // Decorative bars derived from the receipt ID; not a scannable code.
      const bars = rng(seed ^ 0x51ed);
      ink.fillStyle = T.ink;
      let bx = PAD_X + 26;
      while (bx < W - PAD_X - 26) {
        const bw = 1 + Math.floor(bars() * 3);
        if (bx + bw > W - PAD_X - 26) break;
        ink.fillRect(bx, op.y, bw, op.h);
        bx += bw + 1 + Math.floor(bars() * 3);
      }
      continue;
    }
    if (op.t === 'stamp') {
      ink.save();
      ink.translate(op.x, op.y); ink.rotate(-0.24);
      ink.globalAlpha = 0.62; ink.strokeStyle = T.accent; ink.fillStyle = T.accent;
      ink.lineWidth = 2; ink.beginPath(); ink.arc(0, 0, 25, 0, Math.PI * 2); ink.stroke();
      ink.lineWidth = 0.8; ink.beginPath(); ink.arc(0, 0, 21, 0, Math.PI * 2); ink.stroke();
      ink.textAlign = 'center';
      ink.font = 'bold 16px ' + SERIF; ink.fillText('已付', 0, -4);
      ink.font = 'bold 6.5px ' + SERIF;
      if ('letterSpacing' in ink) ink.letterSpacing = '2px';
      ink.fillText('PAID', 1, 10);
      ink.restore();
      continue;
    }
    ink.font = op.font;
    if ('letterSpacing' in ink) ink.letterSpacing = op.spacing + 'px';
    ink.globalAlpha = op.alpha;
    ink.fillStyle = colors[op.color];
    ink.textAlign = op.align;
    const tx = op.x !== undefined ? op.x : op.align === 'center' ? W / 2 + op.spacing / 2 : op.align === 'right' ? W - PAD_X : PAD_X;
    ink.fillText(op.str, tx, op.y);
  }
  ink.globalAlpha = 1;
  ink.globalCompositeOperation = 'destination-out';
  for (let ry = 0; ry < H; ry += 2) {
    ink.fillStyle = 'rgba(0,0,0,' + rand() * T.wear + ')';
    ink.fillRect(0, ry, W, 2);
  }
  for (let i = 0; i < T.wearLines; i++) {
    ink.fillStyle = 'rgba(0,0,0,0.3)';
    ink.fillRect(PAD_X + rand() * inner, 0, 0.8, H);
  }
  ctx.drawImage(inkCanvas, 0, 0, W, H);

  // QR codes stay crisp and high-contrast so phones can scan them: dark modules on a light patch
  // (a cream card on dark papers), with a quiet zone that also covers grid lines.
  for (const op of ops) {
    if (op.t !== 'qr') continue;
    ctx.fillStyle = T.dark ? '#fbf8f0' : T.paper[0];
    if (T.dark && ctx.roundRect) { ctx.beginPath(); ctx.roundRect(op.x, op.y, op.size, op.size, 6); ctx.fill(); }
    else ctx.fillRect(op.x, op.y, op.size, op.size);
    ctx.fillStyle = T.dark ? T.paper[1] : T.ink;
    const o = op.quiet * op.mod;
    for (let row = 0; row < op.n; row++) {
      for (let col = 0; col < op.n; col++) {
        if (!op.qr.isDark(row, col)) continue;
        let run = 1;
        while (col + run < op.n && op.qr.isDark(row, col + run)) run++;
        ctx.fillRect(op.x + o + col * op.mod, op.y + o + row * op.mod, run * op.mod, op.mod);
        col += run - 1;
      }
    }
  }

  canvas.setAttribute('role', 'img');
  canvas.setAttribute('aria-label', spokenText(r));
  return canvas;
}

function spokenText(r) {
  const parts = ['小票', r.title, displayRange(r.purchaseDate, r.endDate)];
  if (r.location) parts.push(r.location);
  if (r.photo) parts.push('照片');
  for (const g of groupItems(r.items)) {
    if (g.name) parts.push('分类 ' + g.name);
    for (const it of g.items) if (it.name) parts.push(it.name + ' ' + formatMoney(it.amountMinor));
  }
  if (r.taxMinor || r.tipMinor) parts.push('小计 ' + formatMoney(r.subtotalMinor));
  if (r.taxMinor) parts.push('税 ' + formatMoney(r.taxMinor));
  if (r.tipMinor) parts.push('小费 ' + formatMoney(r.tipMinor));
  parts.push('合计 ' + formatMoney(r.totalMinor));
  if (r.people >= 2) parts.push(r.people + ' 人，人均 ' + formatMoney(shareMinor(r)));
  const ps = r.people >= 2 ? participantsOf(r) : [];
  if (ps.length) parts.push('名单：' + ps.map((p) => p.name + (p.paid ? '（已转）' : '（未转）')).join('、'));
  if (isSettled(r)) parts.push('已结清');
  if (r.pay && PAY_METHODS[r.pay.method]) parts.push(PAY_METHODS[r.pay.method].name + ' 收款 ' + payDisplay(r.pay) + (payLink(r) ? '，附付款二维码' : ''));
  if (r.note) parts.push('备注：' + r.note);
  parts.push('编号 ' + (r.no || receiptNo(r.id, r.createdAt)));
  return parts.join('。');
}

// Thumbnails are cached in memory only and rebuilt on demand.
const thumbs = new Map();
function thumbnail(r) {
  if (!thumbs.has(r.id)) {
    const c = drawReceipt(r, 1);
    c.removeAttribute('role'); c.setAttribute('aria-hidden', 'true');
    thumbs.set(r.id, c);
  }
  return thumbs.get(r.id);
}

// A small fixed sample receipt per style, used by the style pickers.
const SAMPLE = { title: '周末小记', purchaseDate: '2026-11-14', endDate: null, location: null, note: null, photo: null,
  items: [{ name: '咖啡', amountMinor: 650, category: '' }, { name: '晚餐', amountMinor: 4200, category: '' }], totalMinor: 4850 };
function stylePicker(current, onPick, extraClass) {
  return el('div', { class: 'styles' + (extraClass ? ' ' + extraClass : ''), role: 'radiogroup', 'aria-label': '小票样式' },
    THEME_ORDER.map((key) => {
      const sample = drawReceipt(Object.assign({ id: 'sample-' + key, style: key }, SAMPLE), 1);
      sample.removeAttribute('role'); sample.setAttribute('aria-hidden', 'true');
      return el('button', { type: 'button', role: 'radio', 'aria-checked': String(key === current),
        onclick: () => { if (key !== current) onPick(key); } },
        [el('div', { class: 'swatch' }, sample), el('span', { text: THEMES[key].name })]);
    }));
}

// Full-length PNG of the whole receipt on a neutral backdrop.
function exportBlob(r) {
  const scale = 3, pad = 28;
  const src = drawReceipt(r, scale);
  const out = document.createElement('canvas');
  out.width = src.width + pad * 2 * scale;
  out.height = src.height + pad * 2 * scale;
  const ctx = out.getContext('2d');
  ctx.fillStyle = '#ededed'; ctx.fillRect(0, 0, out.width, out.height);
  ctx.shadowColor = 'rgba(0,0,0,0.2)'; ctx.shadowBlur = 5 * scale; ctx.shadowOffsetY = 3 * scale;
  ctx.drawImage(src, pad * scale, pad * scale);
  return new Promise((resolve, reject) => out.toBlob((b) => b ? resolve(b) : reject(new Error('export failed')), 'image/png'));
}

/* ---------- Views ---------- */

const $ = (id) => document.getElementById(id);
const view = $('view');
let printed = null;            // receipt currently on the print stage
let attempted = false;         // show field errors only after the first Print tap
let showMore = false;
let showExtras = false;       // the tax and tip fields are open
const customRows = new Set();  // item rows whose category is being typed by hand

function el(tag, attrs, children) {
  const node = document.createElement(tag);
  for (const k in attrs || {}) {
    if (k === 'text') node.textContent = attrs[k];
    else if (k.startsWith('on')) node.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] !== null && attrs[k] !== undefined) node.setAttribute(k, attrs[k]);
  }
  for (const c of [].concat(children || [])) if (c) node.append(c);
  return node;
}
function announce(msg) { $('live').textContent = ''; setTimeout(() => { $('live').textContent = msg; }, 30); }
function toast(msg) {
  document.querySelectorAll('.toast').forEach((t) => t.remove());
  const t = el('div', { class: 'toast', role: 'status', text: msg });
  document.body.append(t);
  setTimeout(() => t.remove(), 3200);
}

function setChrome(title, tab, left, right) {
  $('title').textContent = title;
  document.title = title ? title + ' · 小票' : '小票';
  $('top-left').replaceChildren(...(left ? [left] : []));
  $('top-right').replaceChildren(...(right ? [right] : []));
  for (const name of ['new', 'receipts']) {
    if (tab === name) $('tab-' + name).setAttribute('aria-current', 'page');
    else $('tab-' + name).removeAttribute('aria-current');
  }
}

/* New receipt form */

function patchDraft(change) {
  const next = Object.assign({}, state.draft);
  change(next);
  saveDraft(next);
}
function patchItem(i, change) {
  patchDraft((n) => { n.items = n.items.map((x, j) => j === i ? Object.assign({}, x, change) : x); });
}

function optionalLabel(text, forId) {
  const label = el(forId ? 'label' : 'span', { for: forId, class: forId ? null : 'label', text: text + ' ' });
  label.append(el('small', { text: '· 可选' }));
  return label;
}

function renderForm(focusId) {
  setChrome('新建小票', 'new');
  const d = state.draft;
  if (d.location || d.note) showMore = true;
  const keepScroll = window.scrollY;

  const field = (name, label, control, extra) => el('div', { class: 'field', id: 'f-' + name }, [
    el('div', { class: 'head' }, [typeof label === 'string' ? el('label', { for: 'i-' + name, text: label }) : label, extra]),
    control,
    el('p', { class: 'error', id: 'e-' + name, role: 'alert', hidden: '' }),
  ]);
  const input = (name, attrs) => el('input', Object.assign({
    id: 'i-' + name, name, autocomplete: 'off', 'aria-describedby': 'e-' + name,
    oninput: (e) => { patchDraft((n) => { n[name] = e.target.value; }); refresh(); },
  }, attrs));

  // The form reads top to bottom as: what and when, what it cost, who shares it, how it looks.
  const form = el('form', { novalidate: '', onsubmit: onPrint, onkeydown: onFormKey }, [
    el('section', { class: 'card' }, [
      field('title', '标题', el('div', { class: 'box' },
        input('title', { type: 'text', value: d.title, enterkeyhint: 'next' }))),
      el('div', { class: 'two' }, [
        field('date', '日期', el('div', { class: 'box' }, el('input', {
          id: 'i-date', type: 'date', value: d.date || todayISO(), 'aria-describedby': 'e-date',
          oninput: (e) => { patchDraft((n) => { n.date = e.target.value || null; }); refresh(); },
        }))),
        field('endDate', optionalLabel('结束日期', 'i-endDate'), el('div', { class: 'box' }, el('input', {
          id: 'i-endDate', type: 'date', value: d.endDate || '', 'aria-describedby': 'e-endDate',
          oninput: (e) => { patchDraft((n) => { n.endDate = e.target.value || null; }); refresh(); },
        }))),
      ]),
    ]),
    renderItems(d),
    renderSplit(d),
    el('section', { class: 'card' }, [
      el('div', { class: 'card-head' }, el('h2', { text: '照片和样式' })),
      renderPhoto(d),
      stylePicker(THEMES[d.style] ? d.style : 'thermal', (key) => { patchDraft((n) => { n.style = key; }); renderForm(); }),
    ]),
  ]);

  if (showMore) {
    const counter = el('span', { class: 'counter', id: 'note-count' });
    const note = el('textarea', {
      id: 'i-note', name: 'note', rows: '3', 'aria-describedby': 'e-note', placeholder: '为什么值得记住',
      oninput: (e) => { patchDraft((n) => { n.note = e.target.value; }); refresh(); },
    });
    note.value = d.note;
    form.append(el('section', { class: 'card' }, [
      el('div', { class: 'card-head' }, el('h2', { text: '地点和备注' })),
      field('location', '地点', el('div', { class: 'box' },
        input('location', { type: 'text', placeholder: '城市、公园或地址', value: d.location }))),
      field('note', '备注', el('div', { class: 'box' }, note), counter),
    ]));
  } else {
    form.append(el('section', { class: 'card' }, rowButton('地点和备注', () => { showMore = true; renderForm('i-location'); })));
  }

  form.append(el('div', { class: 'print-bar' }, [
    el('p', { class: 'save-error', id: 'save-error', role: 'alert', hidden: '' }),
    el('button', { class: 'btn', id: 'print', type: 'submit', text: '打印' }),
  ]));

  view.replaceChildren(form);
  refresh();
  window.scrollTo(0, keepScroll);
  if (focusId && $(focusId)) $(focusId).focus();
}

// A whole-width row that opens an optional part of the form.
function rowButton(label, onclick, extraClass) {
  return el('button', { type: 'button', class: 'row-btn' + (extraClass ? ' ' + extraClass : ''), onclick },
    [el('span', { text: label }), el('span', { class: 'row-add', text: '添加', 'aria-hidden': 'true' })]);
}

function renderCategory(d, i) {
  const value = d.items[i].category || '';
  if (customRows.has(i)) {
    const commit = (e) => {
      customRows.delete(i);
      patchItem(i, { category: e.target.value.trim() });
      renderForm();
    };
    return el('div', { class: 'cat' }, el('input', {
      id: 'i-item-' + i + '-category', type: 'text', value, placeholder: '分类名称', maxlength: String(LIMITS.category),
      'aria-label': '第 ' + (i + 1) + ' 项的自定义分类', autocomplete: 'off', onchange: commit, onblur: commit,
    }));
  }
  // Defaults, plus any custom categories already used on this receipt.
  const used = d.items.map((it) => it.category).filter((c) => c && !CATEGORIES.includes(c));
  const options = CATEGORIES.concat(Array.from(new Set(used)));
  const select = el('select', {
    id: 'i-item-' + i + '-category', class: value ? null : 'none', 'aria-label': '第 ' + (i + 1) + ' 项的分类',
    onchange: (e) => {
      if (e.target.value === '__custom') { customRows.add(i); renderForm('i-item-' + i + '-category'); return; }
      patchItem(i, { category: e.target.value });
      e.target.classList.toggle('none', !e.target.value);
      // A lone item may be unnamed only while it has no category, so errors can change.
      refresh();
    },
  }, [
    el('option', { value: '', text: '＋ 分类' }),
    ...options.map((c) => el('option', { value: c, text: c })),
    el('option', { value: '__custom', text: '自定义…' }),
  ]);
  select.value = value;
  return el('div', { class: 'cat' }, select);
}

function renderItems(d) {
  const solo = d.items.length === 1;
  const rows = d.items.map((it, i) => el('div', { class: 'item' + (solo ? ' solo' : ''), id: 'f-item-' + i }, [
    el('div', { class: 'row' }, [
      el('div', { class: 'box' }, el('input', {
        id: 'i-item-' + i + '-name', type: 'text', autocomplete: 'off', value: it.name,
        placeholder: solo ? '项目（可不填）' : '项目', 'aria-label': '第 ' + (i + 1) + ' 项名称',
        'aria-describedby': 'e-item-' + i, enterkeyhint: 'next',
        oninput: (e) => { patchItem(i, { name: e.target.value }); refresh(); },
      })),
      el('div', { class: 'box amount' }, [
        el('span', { text: '$', 'aria-hidden': 'true' }),
        el('input', {
          id: 'i-item-' + i + '-amount', type: 'text', inputmode: 'decimal', autocomplete: 'off', value: it.amount,
          placeholder: '0.00', 'aria-label': '第 ' + (i + 1) + ' 项金额（美元），可输入多个数字相加',
          'aria-describedby': 'e-item-' + i + ' h-item-' + i, enterkeyhint: 'next',
          // Typing by hand discards any remembered addends; they are rebuilt when the field is collapsed.
          oninput: (e) => { patchItem(i, { amount: e.target.value, parts: [] }); refresh(); },
          onchange: () => collapseAmount(i),
        }),
        // Phone number pads have no comma or plus key, so offer one.
        el('button', { type: 'button', class: 'plus', 'aria-label': '再加一笔金额', text: '+',
          onclick: () => {
            const input = $('i-item-' + i + '-amount');
            const value = input.value.trim();
            if (value && !/[+＋,，、]$/.test(value)) { input.value = value + '+'; patchItem(i, { amount: input.value, parts: [] }); refresh(); }
            input.focus();
          } }),
      ]),
      solo ? null : el('button', { type: 'button', class: 'remove', 'aria-label': '删除第 ' + (i + 1) + ' 项', text: '×',
        onclick: () => { customRows.clear(); patchDraft((n) => { n.items = n.items.filter((x, j) => j !== i); }); renderForm(); } }),
    ]),
    el('div', { class: 'under' }, [renderCategory(d, i), el('span', { class: 'hint', id: 'h-item-' + i })]),
    el('p', { class: 'error', id: 'e-item-' + i, role: 'alert', hidden: '' }),
  ]));

  const canAdd = d.items.length < LIMITS.items;
  // One running total at the bottom; subtotal, tax and tip lines appear above it only when used.
  const sumLine = (key, label) => el('div', { class: 'sum-line', id: 'sum-' + key, hidden: '' },
    [el('span', { id: 'sum-' + key + '-label', text: label }), el('span', { id: 'sum-' + key + '-amt' })]);
  return el('section', { class: 'card items' }, [

    renderExtras(d),

    ]),

}

// The tax rate used on the most recent receipt, offered as a one-tap suggestion (it rarely changes locally).
function lastTaxRate() {
  const r = state.receipts.slice().sort((a, b) => b.createdAt - a.createdAt).find((x) => x.taxRate);
  return r ? r.taxRate + '%' : null;
}

// Tax and tip, folded into a row until wanted.
function renderExtras(d) {
  if (!showExtras && !String(d.tax || '').trim() && !String(d.tip || '').trim()) {
    return rowButton('税和小费', () => { showExtras = true; renderForm('i-tax'); }, 'extras-link');
  }
  const setField = (name, value) => {
    patchDraft((n) => { n[name] = value; });
    $('i-' + name).value = value;
    refresh();
  };
  const field = (name, label, chips) => el('div', { class: 'extra', id: 'f-' + name }, [

      el('div', { class: 'box amount' }, el('input', {
        id: 'i-' + name, type: 'text', inputmode: 'decimal', autocomplete: 'off', value: d[name] || '', placeholder: '$ 或 %',
        'aria-describedby': 'e-' + name, enterkeyhint: 'next',
        oninput: (e) => { patchDraft((n) => { n[name] = e.target.value; }); refresh(); },

    field('tip', '小费', el('div', { class: 'presets', 'data-field': 'tip' }, TIP_PRESETS.map((p) =>
      el('button', { type: 'button', text: p, 'aria-pressed': 'false', onclick: () => setField('tip', p) })))),

// AA: a switch in the section head; when on, head count, each person's share, rounding, names and payment.
function renderSplit(d) {
  const on = !!d.split;
  const toggle = el('button', { type: 'button', class: 'switch', role: 'switch', id: 'i-split', 'aria-checked': String(on), 'aria-label': 'AA 分摊',

  return el('section', { class: 'card split' }, [
    el('div', { class: 'card-head' }, [el('h2', { text: 'AA 分摊' }), toggle]),

        el('input', { id: 'i-people', type: 'text', inputmode: 'numeric', autocomplete: 'off', value: d.people || '',
          maxlength: '2', 'aria-describedby': 'e-people',

    el('p', { class: 'error', id: 'e-people', role: 'alert', hidden: '' }),
    el('div', { class: 'per-line' }, [el('span', { text: '每人' }), el('b', { id: 'per-person' })]),
    el('p', { class: 'split-hint', id: 'h-split' }),
    el('div', { class: 'rounding', id: 'f-rounding' }, [

// Who owes you, as removable chips.
function renderNames(d) {
  const names = d.names || [];
  const suggestions = recentNames().filter((n) => !names.includes(n)).slice(0, 8);
  return el('div', { class: 'names', id: 'f-names' }, [
    el('label', { class: 'sub-label', for: 'i-names', text: '谁要转给你' }),
    el('div', { class: 'chips' }, [
      ...names.map((n, i) => el('span', { class: 'chip' }, [n,
        el('button', { type: 'button', 'aria-label': '移除 ' + n, text: '×',
          onclick: () => { patchDraft((x) => { x.names = x.names.filter((_, j) => j !== i); }); renderForm('i-names'); } })])),
      el('input', { id: 'i-names', type: 'text', autocomplete: 'off', enterkeyhint: 'done', 'aria-describedby': 'e-names',
        placeholder: names.length ? '再加一个' : '输入名字后回车' }),
    ]),
    suggestions.length ? el('div', { class: 'suggest' }, suggestions.map((n) =>
      el('button', { type: 'button', text: '+ ' + n, onclick: () => addNames(n) }))) : null,

// Adds names to the draft, skipping repeats. If the list outgrows the head count, the count follows.
function addNames(raw, rerender) {
  const add = splitNames(raw);
  if (!add.length) return;
  if (add.some((n) => len(n) > NAME_MAX)) { toast('名字最多 ' + NAME_MAX + ' 个字。'); return; }
  patchDraft((x) => {
    x.names = Array.from(new Set((x.names || []).concat(add)));
    const n = /^\d{1,2}$/.test(String(x.people || '').trim()) ? Number(x.people) : 0;
    if (n < x.names.length + 1 && x.names.length + 1 <= 99) x.people = String(x.names.length + 1);
  });
  if (rerender !== false) renderForm('i-names');
}

// The account is remembered for next time.
function renderPay(d) {
  const pay = d.pay || { method: '', handle: '', code: '' };
  const m = PAY_METHODS[pay.method];
  const setPay = (change) => patchDraft((n) => { n.pay = Object.assign({ method: '', handle: '', code: '' }, n.pay, change); });
  const select = el('select', { id: 'i-pay-method', class: m ? null : 'none', 'aria-label': '收款方式',
    onchange: (e) => { setPay({ method: e.target.value }); renderForm(e.target.value ? 'i-pay' : 'i-pay-method'); },
  }, [el('option', { value: '', text: '不印' }), ...PAY_ORDER.map((k) => el('option', { value: k, text: PAY_METHODS[k].name }))]);
  select.value = pay.method || '';
  return el('div', { class: 'pay', id: 'f-pay' }, [
    el('label', { class: 'sub-label', for: 'i-pay-method', text: '收款码' }),
    el('div', { class: 'pay-row' }, [
      el('div', { class: 'cat' }, select),
      m && m.code ? renderCodePick(pay, setPay) : m ? el('div', { class: 'box' }, [
        m.prefix ? el('span', { text: m.prefix, 'aria-hidden': 'true' }) : null,
        el('input', {
          id: 'i-pay', type: 'text', autocomplete: 'off', enterkeyhint: 'done', autocapitalize: 'off', spellcheck: 'false',
          value: pay.handle, placeholder: m.placeholder, maxlength: '80', 'aria-label': m.name + ' 账号', 'aria-describedby': 'e-pay',
          oninput: (e) => { setPay({ handle: e.target.value }); refresh(); },
          // "@name" or a pasted profile link becomes just the name.
          onchange: (e) => {
            const h = normalizeHandle(pay.method, e.target.value);
            if (h !== e.target.value) { e.target.value = h; setPay({ handle: h }); refresh(); }
          },
        }),
      ]) : null,
    ]),
    el('p', { class: 'error', id: 'e-pay', role: 'alert', hidden: '' }),
  ]);

// WeChat / Alipay: pick a screenshot of the receive code; it is decoded here and only the code is kept.
function renderCodePick(pay, setPay) {
  const m = PAY_METHODS[pay.method];
  const ok = codeMethod(pay.code) === pay.method;
  const file = el('input', { type: 'file', accept: 'image/*', id: 'i-pay', 'aria-describedby': 'e-pay',
    'aria-label': (ok ? '更换' : '上传') + m.name + '收款码截图',
    onchange: async (e) => {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      let text = null;
      try { text = await decodeQrFile(f); } catch (err) { text = null; }
      e.target.value = '';
      const found = codeMethod(text);
      if (!found) {
        toast(text ? '这个二维码不是微信或支付宝收款码。' : '没在图里找到二维码，换一张清晰的截图试试。');
        return;
      }
      setPay({ method: found, code: text.trim() });
      if (found !== pay.method) toast('这是' + PAY_METHODS[found].name + '收款码，已切换到' + PAY_METHODS[found].name);
      else toast('已识别' + m.name + '收款码');
      renderForm('i-pay');
    } });
  let preview = null;
  if (ok && typeof qrcode === 'function') {
    try {
      const qr = qrcode(0, 'M'); qr.addData(pay.code); qr.make();
      const n = qr.getModuleCount(), px = 2;
      preview = el('canvas', { width: n * px, height: n * px, 'aria-hidden': 'true', class: 'code-preview' });
      const ctx = preview.getContext('2d');
      ctx.fillStyle = INK;
      for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) ctx.fillRect(c * px, r * px, px, px);
    } catch (err) { preview = null; }
  }
  return el('label', { class: 'code-pick' + (ok ? ' done' : '') }, [
    file, preview, el('span', { text: ok ? '✓ 已识别 · 更换' : '＋ 上传收款码截图' }),
  ]);
}

// Reads a QR code from an image: the browser's own detector where there is one (Chrome, Android),
// otherwise jsQR, loaded only when first needed.
let jsQRLoading = null;
function loadJsQR() {
  if (typeof jsQR === 'function') return Promise.resolve();
  jsQRLoading = jsQRLoading || new Promise((resolve, reject) => {
    const s = el('script', { src: 'vendor/jsQR.js' });
    s.onload = resolve;
    s.onerror = () => { jsQRLoading = null; reject(new Error('jsQR failed to load')); };
    document.head.append(s);
  });
  return jsQRLoading;
}
async function decodeQrFile(file) {
  const img = await loadImage(file);
  const scale = Math.min(1, 1200 / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.max(1, Math.round(img.naturalWidth * scale)), h = Math.max(1, Math.round(img.naturalHeight * scale));
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
  ctx.drawImage(img, 0, 0, w, h);
  if (window.BarcodeDetector) {
    try {
      const found = await new BarcodeDetector({ formats: ['qr_code'] }).detect(c);
      if (found.length) return found[0].rawValue;
    } catch (err) { /* fall through to jsQR */ }
  }
  await loadJsQR();
  const res = jsQR(ctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'attemptBoth' });
  return res ? res.data : null;
}

// Replaces "18.2, 20.1, 5" in an amount field with its sum, remembering the addends for the receipt.
function collapseAmount(i) {
  const it = state.draft.items[i];
  if (!it) return;
  const a = parseAmount(it.amount);
  if (a.error || a.parts.length < 2) return;
  patchItem(i, { amount: plainAmount(a.minor), parts: a.parts });
  const input = $('i-item-' + i + '-amount');
  if (input) input.value = plainAmount(a.minor);
  refresh();
}

// A new row starts in the previous row's category, so a run of items in one category is quick to enter.
function addItem() {
  const items = state.draft.items;
  if (items.length >= LIMITS.items) return;
  const category = items[items.length - 1].category || '';
  patchDraft((n) => { n.items = n.items.concat({ name: '', amount: '', category, parts: [] }); });
  renderForm('i-item-' + (state.draft.items.length - 1) + '-name');
}

function renderPhoto(d) {
  if (d.photo) {
    const px = 2;
    const c = el('canvas', { width: d.photo.w * px, height: d.photo.h * px, role: 'img', 'aria-label': '照片预览' });
    const ctx = c.getContext('2d');
    ctx.fillStyle = INK;
    fillTone(ctx, atkinson(photoGray(d.photo), d.photo.w, d.photo.h, 2), d.photo.w, d.photo.h, 0, 0, 0, px);
    return el('div', { class: 'field' }, el('div', { class: 'photo-preview' }, [
      c,
      el('button', { type: 'button', class: 'link quiet', text: '移除照片',
        onclick: () => { patchDraft((n) => { n.photo = null; }); renderForm(); } }),
    ]));
  }
  const file = el('input', { type: 'file', accept: 'image/*', id: 'i-photo', 'aria-label': '添加照片',
    onchange: async (e) => {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      try {
        const photo = await photoFromFile(f);
        patchDraft((n) => { n.photo = photo; });
        renderForm();
      } catch (err) {
        e.target.value = '';
        toast('无法读取这张照片，换一张试试。');
      }
    } });
  return el('div', { class: 'field' }, el('label', { class: 'photo-pick' }, [file, '＋ 添加照片']));
}

// Enter moves through the fields instead of printing, so a long list can be typed quickly.
// In an amount field it first adds up whatever was typed.
function onFormKey(e) {
  if (e.key !== 'Enter' || e.target.tagName !== 'INPUT' || e.isComposing) return;
  e.preventDefault();
  const id = e.target.id;
  const m = /^i-item-(\d+)-(name|amount|category)$/.exec(id);
  if (id === 'i-title') $('i-item-0-name').focus();
  else if (id === 'i-tax') $('i-tip').focus();
  else if (id === 'i-people' || id === 'i-pay' || id === 'i-tip') e.target.blur();
  else if (id === 'i-names') addNames(e.target.value);
  else if (m && m[2] === 'category') e.target.blur();
  else if (m && m[2] === 'name') $('i-item-' + m[1] + '-amount').focus();
  else if (m) {
    const multi = (parseAmount(e.target.value).parts || []).length > 1;
    collapseAmount(Number(m[1]));
    if (multi) return; // stay on the field so the computed sum is seen
    const next = $('i-item-' + (Number(m[1]) + 1) + '-name');
    if (next) next.focus();
    else if (e.target.value.trim()) addItem();
  }
}

// Updates errors, hints, the running total and counters in place (no re-render, so focus is kept).
function refresh() {
  const errors = attempted ? validate(state.draft).errors : {};
  view.querySelectorAll('.error[id^="e-"]').forEach((msg) => {
    const key = msg.id.slice(2);
    const box = $('f-' + key);
    const text = errors[key];
    box.classList.toggle('invalid', !!text);
    if (text) { if (msg.textContent !== text) msg.textContent = text; msg.hidden = false; }
    else { msg.hidden = true; msg.textContent = ''; }
    box.querySelectorAll('input, textarea').forEach((i) => {
      if (text) i.setAttribute('aria-invalid', 'true'); else i.removeAttribute('aria-invalid');
    });
  });

  let total = 0;
  state.draft.items.forEach((it, i) => {
    const a = parseAmount(it.amount);
    if (!a.error) total += a.minor;
    const hint = $('h-item-' + i);
    if (!hint) return;
    // While a sum is being typed show its result; once collapsed show what it was made of.
    if (!a.error && a.parts.length > 1) hint.textContent = '= ' + formatMoney(a.minor);
    else if (!a.error && it.parts && it.parts.length > 1 && it.parts.reduce((x, y) => x + y, 0) === a.minor) {
      hint.textContent = it.parts.map(plainAmount).join(' + ');
    } else hint.textContent = '';
  });
  // Tax and tip on top of the items' subtotal; the breakdown lines show only when used.
  const d = state.draft;
  const subtotal = total;
  const tax = parseExtra(d.tax, subtotal, 30), tip = parseExtra(d.tip, subtotal, 100);
  total = subtotal + (tax.minor || 0) + (tip.minor || 0);
  const hasExtras = !!((tax.minor || 0) + (tip.minor || 0));
  const sumLine = (key, show, label, minor) => {
    if (!$('sum-' + key)) return;
    $('sum-' + key).hidden = !show;
    if (label) $('sum-' + key + '-label').textContent = label;
    $('sum-' + key + '-amt').textContent = formatMoney(minor || 0);
  };
  sumLine('sub', hasExtras, null, subtotal);
  sumLine('tax', !!tax.minor, '税' + (tax.rate ? ' ' + tax.rate + '%' : ''), tax.minor);
  sumLine('tip', !!tip.minor, '小费' + (tip.rate ? ' ' + tip.rate + '%' : ''), tip.minor);
  if ($('grand-total')) $('grand-total').textContent = formatMoney(total);
  view.querySelectorAll('.presets button').forEach((b) => b.setAttribute('aria-pressed',
    String(String(d[b.parentNode.dataset.field] || '').replace(/\s/g, '') === b.textContent)));

  if ($('per-person')) {
    const n = /^\d{1,2}$/.test(String(d.people || '').trim()) ? Number(d.people) : 0;
    const share = splitShare(total, n, d.rounding || 'cent');
    $('per-person').textContent = n >= 2 ? formatMoney(share) : '—';
    // How an uneven split adds up; the rounding choice only matters when it is not whole dollars each.
    $('h-split').textContent = n >= 2 && share * n !== total
      ? (n - 1) + ' 人各 ' + formatMoney(share) + '，你 ' + formatMoney(total - share * (n - 1)) : '';
    $('f-rounding').hidden = !(n >= 2 && total % (n * 100) !== 0);
    view.querySelectorAll('#f-rounding button').forEach((b) => b.setAttribute('aria-checked', String(b.dataset.mode === (d.rounding || 'cent'))));
  }
  const counter = $('note-count');
  if (counter) {
    const n = len(state.draft.note);
    counter.textContent = n + '/' + LIMITS.note;
    counter.classList.toggle('over', n > LIMITS.note);
  }
}

function onPrint(e) {
  e.preventDefault();
  if ($('print').disabled) return;
  // A name typed but not yet turned into a chip still counts (re-render so the chip and head count show).
  const pendingName = $('i-names') ? $('i-names').value.trim() : '';
  if (pendingName) { addNames(pendingName, false); renderForm(); }
  const button = $('print');
  attempted = true;
  $('save-error').hidden = true;

  const result = validate(state.draft);
  if (!result.input) {
    if ((result.errors.location || result.errors.note) && !showMore) { showMore = true; renderForm(); }
    refresh();
    const first = Array.from(view.querySelectorAll('.error[id^="e-"]')).find((m) => !m.hidden);
    const key = first.id.slice(2);
    const target = $('i-' + key + (result.focus[key] ? '-' + result.focus[key] : ''));
    target.focus();
    target.scrollIntoView({ block: 'center', behavior: 'smooth' });
    return;
  }

  // Lock the button right away; the write happens on the next tick so the locked state paints first.
  button.disabled = true;
  button.textContent = '打印中…';
  setTimeout(() => {
    try {
      printed = commit(result.input);
      attempted = false;
      showMore = false;
      showExtras = false;
      customRows.clear();
      renderStage();
    } catch (err) {
      button.disabled = false;
      button.textContent = '打印';
      const msg = $('save-error');
      msg.textContent = '小票未保存，请重试。';
      msg.hidden = false;
    }
  }, 0);
}

/* Print stage: only shown after the receipt is already saved. */

function renderStage() {
  setChrome('', 'new');
  const receipt = printed;
  const canvas = drawReceipt(receipt);
  const feed = el('div', { class: 'feed' }, canvas);
  const viewIt = () => { printed = null; location.hash = '#/r/' + receipt.id; };
  const after = el('div', { class: 'after' }, [
    el('p', { text: '✓ 已收进小票夹' }),
    receipt.people >= 2 ? el('div', { class: 'copy' }, [
      el('button', { type: 'button', class: 'link', text: '保存图片', onclick: () => saveImage(receipt) }),
      el('span', { text: '  ·  ', 'aria-hidden': 'true', style: 'color:var(--muted)' }),
      el('button', { type: 'button', class: 'link', text: '复制群聊文案', onclick: () => copyChatText(receipt) }),
    ]) : null,
    el('div', { class: 'row' }, [
      el('button', { class: 'btn secondary', text: '查看小票', onclick: viewIt }),
      el('button', { class: 'btn', text: '再印一张', onclick: () => { printed = null; renderForm(); window.scrollTo(0, 0); } }),
    ]),
  ]);
  view.replaceChildren(el('div', { class: 'stage' }, [el('div', { class: 'slot', 'aria-hidden': 'true' }), feed, after]));
  window.scrollTo(0, 0);

  // Longer receipts take a little longer to feed, within the 0.8–1.2 s target.
  const seconds = Math.min(1.2, Math.max(0.8, parseFloat(canvas.style.height) / 500));
  feed.style.setProperty('--feed', seconds + 's');

  let finished = false;
  const done = () => {
    if (finished) return;
    finished = true;
    feed.classList.add('done');
    after.classList.add('show');
    canvas.addEventListener('click', viewIt);
    announce('已收进小票夹');
  };
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    feed.classList.add('instant');
    done();
  } else {
    requestAnimationFrame(() => requestAnimationFrame(() => feed.classList.add('go')));
    canvas.addEventListener('transitionend', done);
    setTimeout(done, seconds * 1000 + 400); // safety net if the tab was hidden during the feed
  }
}

/* Receipt folder */

function renderList() {
  setChrome('小票夹', 'receipts');
  if (!state.receipts.length) {
    view.replaceChildren(el('div', { class: 'empty' }, [
      el('h2', { text: '还没有小票' }),
      el('p', { text: '把值得记住的花费印成一张小票。' }),
      el('a', { class: 'btn small', href: '#/new', text: '印第一张', style: 'text-decoration:none;display:inline-block' }),
    ]));
    return;
  }
  view.replaceChildren(el('ul', { class: 'list' }, sorted(state.receipts).map((r) =>
    el('li', {}, el('a', { href: '#/r/' + r.id }, [
      el('div', { class: 'thumb' }, thumbnail(r)),
      el('div', { class: 'meta' }, [el('b', { text: r.title }), el('span', { text: displayRange(r.purchaseDate, r.endDate) })]),
      el('div', { class: 'amt', text: formatMoney(r.totalMinor) }),
    ])))));
}

/* Detail */

function renderDetail(id, keepScroll) {
  const r = state.receipts.find((x) => x.id === id);
  if (!r) { location.replace('#/receipts'); return; }

  const back = el('a', { class: 'icon-btn', href: '#/receipts', text: '‹ 小票夹',
    style: 'display:inline-flex;align-items:center;text-decoration:none;color:inherit' });
  const menu = el('div', { class: 'menu', hidden: '', role: 'menu' }, [
    el('button', { role: 'menuitem', text: '保存图片', onclick: () => { menu.hidden = true; saveImage(r); } }),
    el('button', { role: 'menuitem', class: 'danger', text: '删除小票', onclick: () => { menu.hidden = true; confirmDelete(r); } }),
  ]);
  const more = el('button', { class: 'icon-btn', 'aria-label': '更多', 'aria-haspopup': 'menu', text: '•••',
    onclick: (e) => { e.stopPropagation(); menu.hidden = !menu.hidden; } });
  setChrome('', 'receipts', back, el('div', { style: 'position:relative' }, [more, menu]));

  const y = window.scrollY;
  view.replaceChildren(el('div', { class: 'detail' }, [
    drawReceipt(r),
    // A split receipt is usually about to be sent to the group, so its actions sit right below it.
    r.people >= 2 ? el('div', { class: 'actions' }, [
      el('button', { class: 'btn secondary small', text: '保存图片', onclick: () => saveImage(r) }),
      el('button', { class: 'btn small', text: '复制群聊文案', onclick: () => copyChatText(r) }),
    ]) : null,
    r.people >= 2 ? renderProgress(r) : null,
    el('section', { class: 'card' }, [
      el('div', { class: 'card-head' }, el('h2', { text: '更换样式' })),
      stylePicker(THEMES[r.style] ? r.style : 'thermal', (key) => {
        try { restyleReceipt(r.id, key); renderDetail(r.id, true); }
        catch (err) { toast('样式未保存，请重试。'); }
      }),
    ]),
  ]));
  window.scrollTo(0, keepScroll ? y : 0);
}
// Payment tracking: tick people off as their transfers arrive. Names can also be added here,
// for a receipt printed before everyone's name was known.
function renderProgress(r) {
  const ps = participantsOf(r);
  const owed = owedCount(r);
  const paid = ps.filter((p) => p.paid).length;
  const save = (participants, msg) => {
    const wasSettled = isSettled(r);
    try { updateReceipt(r.id, { participants: participants.length ? participants : null }); }
    catch (err) { toast('未保存，请重试。'); return; }
    const now = state.receipts.find((x) => x.id === r.id);
    renderDetail(r.id, true);
    if (!wasSettled && isSettled(now)) toast('全部收齐，小票已盖章');
    else if (msg) announce(msg);
  };
  const addFrom = (input) => {
    const add = splitNames(input.value).filter((n) => !ps.some((p) => p.name === n));
    if (!add.length) { input.value = ''; return; }
    if (add.some((n) => len(n) > NAME_MAX)) { toast('名字最多 ' + NAME_MAX + ' 个字。'); return; }
    if (ps.length + add.length > owed) { toast('最多 ' + owed + ' 人（' + r.people + ' 人里不含你自己）。'); return; }
    save(ps.concat(add.map((name) => ({ name, paid: false }))));
    const again = $('add-name'); if (again) again.focus();
  };

  const rows = ps.map((p, i) => el('li', { class: 'pg-row' + (p.paid ? ' paid' : '') }, [
    el('button', { type: 'button', class: 'pg-check', role: 'checkbox', 'aria-checked': String(!!p.paid), 'aria-label': p.name + ' 已转账',
      onclick: () => save(ps.map((x, j) => j === i ? Object.assign({}, x, { paid: !x.paid, paidAt: !x.paid ? Date.now() : null }) : x),
        p.name + (p.paid ? ' 改为未转' : ' 已转')) }, [
      el('span', { class: 'box-mark', 'aria-hidden': 'true' }),
      el('span', { class: 'pg-name', text: p.name }),
      el('span', { class: 'pg-amt', text: p.paid ? '已转' : formatMoney(shareMinor(r)) }),
    ]),
    el('button', { type: 'button', class: 'pg-remove', 'aria-label': '从名单移除 ' + p.name, text: '×',
      onclick: () => save(ps.filter((_, j) => j !== i), '已移除 ' + p.name) }),
  ]));

  const left = owed - ps.length;
  const input = el('input', { id: 'add-name', type: 'text', autocomplete: 'off', enterkeyhint: 'done', 'aria-label': '添加名字',
    placeholder: ps.length ? '还有 ' + left + ' 人没填名字' : '填上名字，转了就打勾',
    onkeydown: (e) => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); addFrom(e.target); } } });
  const suggestions = left > 0 ? recentNames().filter((n) => !ps.some((p) => p.name === n)).slice(0, 8) : [];

  return el('section', { class: 'card progress', 'aria-label': '收款进度' }, [
    el('div', { class: 'pg-head' }, [
      el('b', { text: '收款进度' }),
      el('span', { text: ps.length ? paid + '/' + owed + ' 人 · 已收 ' + formatMoney(paid * shareMinor(r)) : owed + ' 人待转' }),
    ]),
    rows.length ? el('ul', { class: 'pg-list' }, rows) : null,
    left > 0 ? el('div', { class: 'pg-add' }, [
      el('div', { class: 'box' }, input),
      el('button', { type: 'button', class: 'btn secondary small', text: '添加', onclick: () => addFrom(input) }),
    ]) : null,
    suggestions.length ? el('div', { class: 'suggest' }, suggestions.map((n) =>
      el('button', { type: 'button', text: '+ ' + n, onclick: () => { input.value = n; addFrom(input); } }))) : null,
  ]);
}

document.addEventListener('click', () => document.querySelectorAll('.menu').forEach((m) => { m.hidden = true; }));

async function saveImage(r) {
  try {
    const blob = await exportBlob(r);
    const name = '小票-' + r.purchaseDate + '.png';
    const file = new File([blob], name, { type: 'image/png' });
    // On phones the share sheet offers "Save Image"; elsewhere download the file.
    if (window.matchMedia('(pointer: coarse)').matches && navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file] });
      return;
    }
    const url = URL.createObjectURL(blob);
    const a = el('a', { href: url, download: name });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast('图片已保存');
  } catch (err) {
    if (err && err.name === 'AbortError') return;
    toast('图片保存失败，请重试。');
  }
}

// A message to paste into the group chat next to the receipt image, with the payment link to tap.
function chatText(r) {
  const lines = [r.title + ' · ' + displayRange(r.purchaseDate, r.endDate)];
  const extras = [r.taxMinor ? '税' : '', r.tipMinor ? '小费' : ''].filter(Boolean).join('和');
  lines.push('合计 ' + formatMoney(r.totalMinor) + (extras ? '（含' + extras + '）' : '') +
    (r.people >= 2 ? '，' + r.people + ' 人，每人 ' + formatMoney(shareMinor(r)) +
      (r.rounding === 'up' ? '（凑整）' : r.rounding === 'down' ? '（抹零）' : '') : ''));
  // Before anyone pays it lists the group; after that it says who is still due.
  const ps = r.people >= 2 ? participantsOf(r) : [];
  const unpaid = ps.filter((p) => !p.paid).map((p) => p.name);
  if (isSettled(r)) { lines.push('已全部收齐，谢谢大家！'); return lines.join('\n'); }
  if (ps.length && unpaid.length === ps.length) lines.push('名单：' + unpaid.join('、'));
  else if (ps.length) lines.push('还差：' + (unpaid.length ? unpaid.join('、') : '') + (ps.length < owedCount(r) ? (unpaid.length ? '，' : '') + '还有 ' + (owedCount(r) - ps.length) + ' 人' : ''));
  if (r.pay && PAY_METHODS[r.pay.method]) {
    const link = payLink(r);
    // A WeChat code is not a link anyone can tap; it is read from the receipt image instead.
    if (r.pay.method === 'wechat') lines.push('微信：长按小票图片，识别二维码付款');
    else lines.push(link ? PAY_METHODS[r.pay.method].name + ' 点这里付：' + link
      : PAY_METHODS[r.pay.method].name + ' 转账至：' + payDisplay(r.pay));
  }
  return lines.join('\n');
}

async function copyChatText(r) {
  const str = chatText(r);
  try {
    await navigator.clipboard.writeText(str);
  } catch (err) {
    // Older browsers or no clipboard permission: copy through a hidden text area.
    const ta = el('textarea', { readonly: '', style: 'position:fixed;top:0;left:0;opacity:0' });
    ta.value = str;
    document.body.append(ta); ta.select();
    const ok = document.execCommand && document.execCommand('copy');
    ta.remove();
    if (!ok) { toast('复制失败，请重试。'); return; }
  }
  toast('文案已复制，粘贴到群里就行');
}

function confirmDelete(r) {
  const dialog = $('confirm');
  $('confirm-cancel').onclick = () => dialog.close();
  $('confirm-ok').onclick = () => {
    dialog.close();
    try { removeReceipt(r.id); location.hash = '#/receipts'; }
    catch (err) { toast('删除失败，请重试。'); }
  };
  dialog.showModal();
}

/* Router */

function route() {
  const hash = location.hash;
  if (hash.startsWith('#/r/')) return renderDetail(decodeURIComponent(hash.slice(4)));
  if (hash === '#/receipts') return renderList();
  if (printed) return renderStage();
  renderForm();
}
window.addEventListener('hashchange', route);
// Another tab changed the data: pick it up.
window.addEventListener('storage', (e) => {
  if (e.key !== KEY) return;
  state = loadState(); thumbs.clear();
  if (location.hash === '#/receipts' || location.hash.startsWith('#/r/')) route();
});
route();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
