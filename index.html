<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f1efea">
<meta name="description" content="把一趟旅行、一天或一个瞬间的花费，印成一张值得留下的小票。">
<title>小票</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root {
    color-scheme: light;
    --bg: #f1efea;
    --card: #ffffff;
    --ink: #232126;
    --muted: #77737c;
    --line: #e6e2da;
    --fill: #f3f1ec;
    --error: #c8321e;
    --tabs-h: 64px;
    --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); }
  body { min-height: 100dvh; -webkit-text-size-adjust: 100%; }
  .app { max-width: 480px; margin: 0 auto; min-height: 100dvh; padding-bottom: calc(var(--tabs-h) + env(safe-area-inset-bottom)); }
  header.top { display: flex; align-items: center; justify-content: center; position: relative; height: 56px; padding: 0 16px; }
  header.top h1 { font-size: 17px; font-weight: 650; margin: 0; }
  header.top .left, header.top .right { position: absolute; top: 8px; }
  header.top .left { left: 10px; } header.top .right { right: 10px; }
  main { padding: 4px 16px 24px; }

  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .btn { border: 0; border-radius: 999px; padding: 15px 20px; font-weight: 650; font-size: 17px; background: var(--ink); color: #fff; width: 100%; }
  .btn.secondary { background: #e4e1da; color: var(--ink); }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn.small { width: auto; padding: 10px 18px; font-size: 15px; }
  .icon-btn { border: 0; background: transparent; height: 40px; min-width: 40px; padding: 0 10px; border-radius: 999px; font-size: 16px; font-weight: 600; }
  .icon-btn:hover { background: #e4e1da; }
  :focus-visible { outline: 2px solid #3b6fd9; outline-offset: 2px; }

  /* Form */
  .field { margin-bottom: 18px; min-width: 0; }
  .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .head label, .head .label { font-size: 13px; font-weight: 650; color: var(--muted); }
  .head small { font-weight: 500; }
  .counter { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .counter.over { color: var(--error); }
  .box { display: flex; align-items: center; gap: 6px; background: var(--card); border: 1px solid transparent; border-radius: 12px; padding: 0 14px; min-width: 0; }
  .box:focus-within { border-color: #b9b4aa; }
  .invalid > .box, .invalid .row .box { border-color: var(--error); }
  .box input, .box textarea { border: 0; outline: 0; background: transparent; width: 100%; padding: 13px 0; font-size: 17px; min-width: 0; }
  .box input[type="date"] { min-height: 48px; }
  .box textarea { resize: vertical; min-height: 96px; line-height: 1.4; }
  .box.amount { font-family: var(--mono); }
  .box.amount span { color: var(--muted); }
  .error { color: var(--error); font-size: 13px; margin: 6px 2px 0; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .item { margin-bottom: 12px; }
  .item .box { padding: 0 12px; }
  .item .box input { font-size: 16px; padding: 12px 0; }
  .item .remove { border: 0; background: none; color: var(--muted); font-size: 22px; line-height: 1; height: 34px; width: 34px; border-radius: 999px; padding: 0; }
  .item .remove:hover { background: #e4e1da; color: var(--ink); }
  .under { margin-top: 6px; }
  .cat { display: flex; align-items: center; gap: 8px; }
  .cat select, .cat input { font-size: 16px; border: 0; border-radius: 999px; background: #e7e4dc; padding: 5px 12px; max-width: 200px; height: 32px; }
  .cat select { appearance: none; -webkit-appearance: none; padding-right: 26px; background-image: linear-gradient(45deg, transparent 50%, #77737c 50%), linear-gradient(135deg, #77737c 50%, transparent 50%); background-position: calc(100% - 15px) 14px, calc(100% - 10px) 14px; background-size: 5px 5px; background-repeat: no-repeat; }
  .cat select.none { color: var(--muted); }
  .cat input { background: var(--card); width: 150px; }
  .under { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .hint { font-family: var(--mono); font-size: 12.5px; color: var(--muted); text-align: right; overflow-wrap: anywhere; }
  .plus { border: 0; background: #ece9e2; color: var(--ink); width: 26px; height: 26px; flex: none; border-radius: 999px; padding: 0; font-size: 17px; line-height: 1; font-family: var(--sans); }
  .extra { margin-bottom: 10px; }
  .extra-row { display: flex; align-items: center; gap: 8px; }
  .extra-row .box input { font-size: 16px; padding: 10px 0; text-align: right; }
  .extra.invalid .box { border-color: var(--error); }
  .presets { display: flex; gap: 6px; flex-wrap: wrap; }
  .presets button { border: 0; background: #e7e4dc; border-radius: 999px; padding: 6px 10px; font-size: 14px; font-weight: 600; font-family: var(--mono); }
  .presets button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .seg { display: inline-flex; background: #e7e4dc; border-radius: 999px; padding: 3px; gap: 2px; }
  .seg button { border: 0; background: none; border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 600; color: var(--muted); }
  .seg button[aria-checked="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .code-pick { flex: 1; display: flex; align-items: center; justify-content: center; gap: 10px; background: var(--card); border: 1px dashed #c9c4b9; border-radius: 12px; padding: 10px 12px; font-weight: 600; font-size: 15px; cursor: pointer; min-height: 44px; }
  .code-pick.done { border-style: solid; border-color: transparent; justify-content: flex-start; }
  .code-pick:focus-within { outline: 2px solid #3b6fd9; outline-offset: 2px; }
  .code-pick input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .code-preview { width: 44px; height: 44px; image-rendering: pixelated; }
  .pay.invalid .code-pick { border-color: var(--error); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; background: var(--card); border: 1px solid transparent; border-radius: 12px; padding: 7px 8px; }
  .chips:focus-within { border-color: #b9b4aa; }
  .names.invalid .chips { border-color: var(--error); }
  .chip { display: inline-flex; align-items: center; gap: 2px; background: #ece9e2; border-radius: 999px; padding: 4px 4px 4px 11px; font-size: 15px; }
  .chip button { border: 0; background: none; color: var(--muted); width: 24px; height: 24px; border-radius: 999px; padding: 0; font-size: 17px; line-height: 1; }
  .chip button:hover { background: #dcd8cf; color: var(--ink); }
  .chips input { flex: 1; min-width: 120px; border: 0; outline: 0; background: transparent; font-size: 16px; padding: 5px 4px; }
  .suggest { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .suggest button { border: 1px dashed #c9c4b9; background: none; border-radius: 999px; padding: 4px 11px; font-size: 14px; color: var(--muted); }
  .suggest button:hover { color: var(--ink); border-color: var(--ink); }
  .pay-row { display: flex; align-items: center; gap: 10px; }
  .pay-row > label { font-size: 13px; font-weight: 650; color: var(--muted); white-space: nowrap; }
  .pay-row .box { flex: 1; padding: 0 12px; font-family: var(--mono); gap: 2px; }
  .pay-row .box span { color: var(--muted); font-size: 15px; }
  .pay-row .box input { font-size: 16px; padding: 10px 0; }
  .pay.invalid .box { border-color: var(--error); }
  .progress { padding-bottom: 12px; }
  .detail > .card { width: 100%; margin: 12px 0 0; }
  .pg-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .pg-head b { font-size: 16px; }
  .pg-head span { color: var(--muted); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .pg-list { list-style: none; margin: 0; padding: 0; }
  .pg-row { display: flex; align-items: center; }
  .pg-row + .pg-row { border-top: 1px solid var(--line); }
  .pg-check { flex: 1; display: flex; align-items: center; gap: 12px; border: 0; background: none; padding: 11px 2px; text-align: left; min-width: 0; }
  .box-mark { width: 22px; height: 22px; flex: none; border: 2px solid #b9b4aa; border-radius: 7px; position: relative; }
  .paid .box-mark { background: var(--ink); border-color: var(--ink); }
  .paid .box-mark::after { content: ""; position: absolute; left: 6px; top: 2px; width: 5px; height: 10px; border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: rotate(45deg); }
  .pg-name { flex: 1; font-size: 16px; font-weight: 600; overflow-wrap: anywhere; }
  .paid .pg-name { color: var(--muted); }
  .pg-amt { font-family: var(--mono); font-size: 14px; color: var(--muted); }
  .pg-remove { border: 0; background: none; color: var(--muted); width: 32px; height: 32px; border-radius: 999px; font-size: 19px; padding: 0; }
  .pg-remove:hover { background: #ece9e2; color: var(--ink); }
  .pg-add { display: flex; gap: 8px; margin-top: 8px; }
  .pg-add .box { flex: 1; background: var(--fill); }
  .pg-add .box input { font-size: 16px; padding: 10px 0; }
  .progress .suggest { margin-top: 10px; }
  .actions { display: flex; gap: 10px; width: 100%; margin-top: 18px; }
  .actions .btn { flex: 1; }
  .after .copy { margin: -6px 0 8px; }
  .link { border: 0; background: none; padding: 6px 0; font-weight: 600; font-size: 15px; }

  .photo-pick { display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--card); border: 1px dashed #c9c4b9; border-radius: 12px; padding: 16px; font-weight: 600; font-size: 15px; cursor: pointer; }
  .photo-pick:focus-within { outline: 2px solid #3b6fd9; outline-offset: 2px; }
  .photo-pick input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .photo-preview { background: #fbf8f0; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .photo-preview canvas { max-width: 100%; height: auto; }

  /* Form cards: each part of the form is one card with a short title. Inputs inside are filled grey. */
  .card { background: var(--card); border-radius: 18px; padding: 16px 14px; margin-bottom: 12px; }
  .card-head { display: flex; justify-content: space-between; align-items: center; min-height: 30px; margin-bottom: 12px; }
  .card-head.flat { margin-bottom: 0; }
  .card-head h2 { font-size: 16px; font-weight: 700; margin: 0; }
  .card .box, .card .chips, .card .code-pick, .card .photo-pick { background: var(--fill); }
  .card .field { margin-bottom: 14px; }
  .card .field:last-child, .card .two .field { margin-bottom: 0; }
  .card .cat input { background: var(--fill); }
  .item .row { display: grid; grid-template-columns: minmax(0, 1fr) 128px 28px; gap: 6px; align-items: center; }
  .item.solo .row { grid-template-columns: minmax(0, 1fr) 128px; }
  .add-item { display: block; padding: 2px 0 4px; }
  .link.quiet { color: var(--muted); font-weight: 500; font-size: 14px; }
  .row-btn { display: flex; width: 100%; justify-content: space-between; align-items: center; border: 0; background: none; padding: 4px 0; font-size: 16px; font-weight: 700; text-align: left; }
  .row-add { color: var(--muted); font-size: 14px; font-weight: 500; }
  .row-add::after { content: " ＋"; }
  .extras-link { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 14px; font-size: 15px; font-weight: 600; }
  .extras { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 10px; }
  .sub-head { display: flex; justify-content: space-between; align-items: center; font-size: 15px; font-weight: 600; margin-bottom: 8px; }
  .extra-row > label { font-size: 14px; font-weight: 600; width: 32px; flex: none; }
  .extra-row .box { width: 96px; flex: none; padding: 0 10px; margin-left: auto; }
  .totals { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 10px; }
  .sum-line { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); padding: 1px 0; }
  .sum-line span:last-child { font-family: var(--mono); }
  .grand-line { display: flex; justify-content: space-between; align-items: baseline; padding-top: 2px; }
  .grand-line span { font-weight: 650; }
  .grand-line b, .per-line b { font-family: var(--mono); font-size: 22px; }
  .switch { width: 50px; height: 30px; flex: none; border: 0; border-radius: 999px; background: #d9d5cc; position: relative; padding: 0; transition: background .2s; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
  .switch[aria-checked="true"] { background: var(--ink); }
  .switch[aria-checked="true"]::after { transform: translateX(20px); }
  .field-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .field-row > label { font-size: 15px; font-weight: 600; }
  .stepper { display: flex; align-items: center; background: var(--fill); border: 1px solid transparent; border-radius: 999px; padding: 3px; }
  .stepper button { width: 34px; height: 34px; border: 0; border-radius: 50%; background: var(--card); font-size: 20px; line-height: 1; padding: 0; box-shadow: 0 1px 2px rgba(0,0,0,.1); }
  .stepper input { width: 42px; border: 0; outline: 0; background: transparent; text-align: center; font-size: 17px; font-weight: 650; font-family: var(--mono); }
  #f-people.invalid .stepper { border-color: var(--error); }
  .per-line { display: flex; justify-content: space-between; align-items: baseline; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
  .per-line span { font-weight: 650; }
  .split-hint { margin: 2px 0 0; text-align: right; font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
  .split-hint:empty { display: none; }
  .rounding { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; }
  .rounding .sub-label { margin: 0; }
  .seg button { padding: 6px 10px; font-size: 13.5px; }
  .sub-label { display: block; font-size: 13px; font-weight: 650; color: var(--muted); margin: 16px 0 6px; }
  .pay-row .cat select { height: 44px; border-radius: 12px; background-color: var(--fill); }
  .photo-pick { padding: 14px; }
  .card .photo-preview { margin-bottom: 12px; }
  .card .styles button { background: var(--fill); }

  /* Style picker */
  .styles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .styles button { border: 2px solid transparent; background: #e9e6df; border-radius: 14px; padding: 8px 4px 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
  .styles button[aria-checked="true"] { border-color: var(--ink); color: var(--ink); background: var(--card); }
  .swatch { width: 60px; height: 72px; overflow: hidden; border-radius: 3px; }
  .swatch canvas { width: 60px !important; height: auto !important; display: block; }
  .photo-preview .counter { text-align: center; }

  .print-bar { position: sticky; bottom: calc(var(--tabs-h) + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg) 75%, transparent); padding: 14px 0 12px; margin-top: 6px; }
  .save-error { color: var(--error); font-size: 14px; font-weight: 600; text-align: center; margin: 0 0 10px; }

  /* Print stage */
  .stage { display: flex; flex-direction: column; align-items: center; padding-top: 12px; }
  .slot { width: 336px; max-width: 100%; height: 16px; border-radius: 999px; background: linear-gradient(#3d3d3d, #191919); position: relative; z-index: 1; box-shadow: 0 2px 4px rgba(0,0,0,.25); }
  .slot::after { content: ""; position: absolute; left: 13px; right: 13px; top: 6px; height: 4px; border-radius: 4px; background: #000; }
  .feed { overflow: hidden; padding: 0 16px 22px; margin-top: -8px; }
  .feed canvas { transform: translateY(-105%); cursor: default; }
  .feed.go canvas { transform: none; transition: transform var(--feed, 1s) linear; }
  .feed.instant canvas { transform: none; }
  .feed.done canvas { cursor: pointer; }
  .after { width: 100%; text-align: center; visibility: hidden; opacity: 0; transition: opacity .2s; position: sticky; bottom: calc(var(--tabs-h) + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg) 80%, transparent); padding: 14px 0 12px; }
  .after.show { visibility: visible; opacity: 1; }
  .after p { color: var(--muted); font-weight: 600; font-size: 15px; margin: 4px 0 14px; }
  .after .row { display: flex; gap: 12px; }

  canvas.receipt { display: block; filter: drop-shadow(0 3px 5px rgba(0,0,0,.18)); }

  /* List */
  .list { list-style: none; margin: 0; padding: 0; }
  .list li + li { border-top: 1px solid var(--line); }
  .list a { display: flex; align-items: center; gap: 14px; padding: 12px 2px; text-decoration: none; color: inherit; }
  .thumb { width: 46px; height: 58px; overflow: hidden; flex: none; }
  .thumb canvas { width: 46px !important; height: auto !important; filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.25)); }
  .list .meta { flex: 1; min-width: 0; }
  .list .meta b { font-size: 16px; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .list .meta span { color: var(--muted); font-size: 14px; }
  .list .amt { font-family: var(--mono); font-size: 15px; font-weight: 600; }
  .empty { text-align: center; padding: 22vh 0 0; }
  .empty h2 { font-size: 20px; margin: 0 0 6px; }
  .empty p { color: var(--muted); margin: 0 0 20px; }

  /* Detail */
  .detail { display: flex; flex-direction: column; align-items: center; padding: 12px 0 8px; }
  .menu { position: absolute; right: 0; top: 44px; background: var(--card); border-radius: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.18); padding: 6px; min-width: 170px; z-index: 5; }
  .menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 12px 14px; border-radius: 9px; font-size: 16px; }
  .menu button:hover { background: #f1efea; }
  .menu .danger { color: var(--error); }
  .toast { position: fixed; left: 50%; bottom: calc(var(--tabs-h) + 20px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 999px; font-size: 14px; font-weight: 600; z-index: 20; max-width: 90vw; text-align: center; }

  dialog { border: 0; border-radius: 18px; padding: 22px; max-width: 320px; width: calc(100vw - 48px); box-shadow: 0 20px 60px rgba(0,0,0,.3); }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  dialog h2 { font-size: 18px; margin: 0 0 6px; }
  dialog p { color: var(--muted); margin: 0 0 18px; font-size: 15px; line-height: 1.4; }
  dialog .row { display: flex; gap: 10px; }
  .btn.danger { background: var(--error); }

  /* Tabs */
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; height: calc(var(--tabs-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: rgba(250,249,246,.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line); display: flex; justify-content: center; z-index: 10; }
  nav.tabs a { flex: 1; max-width: 240px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: var(--muted); font-size: 12px; font-weight: 600; }
  nav.tabs a[aria-current="page"] { color: var(--ink); }
  nav.tabs svg { width: 24px; height: 24px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="left" id="top-left"></div>
    <h1 id="title">新建小票</h1>
    <div class="right" id="top-right"></div>
  </header>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="导航">
  <a href="#/new" id="tab-new">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 8V4h10v4"/><rect x="3" y="8" width="18" height="8" rx="2"/><path d="M7 13h10v7H7z"/></svg>
    新建
  </a>
  <a href="#/receipts" id="tab-receipts">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-2-1.5L14 21l-2-1.5L10 21l-2-1.5L6 21z"/><path d="M9 8h6M9 12h6"/></svg>
    小票夹
  </a>
</nav>

<dialog id="confirm">
  <h2>删除这张小票？</h2>
  <p>删除后无法恢复。已经保存的图片不受影响。</p>
  <div class="row">
    <button class="btn secondary small" id="confirm-cancel" style="flex:1">取消</button>
    <button class="btn danger small" id="confirm-ok" style="flex:1">删除</button>
  </div>
</dialog>
<div class="sr" aria-live="polite" id="live"></div>

<script src="vendor/qrcode.js"></script>
<script>
'use strict';

/* ---------- Model ---------- */

const LIMITS = { title: 60, itemName: 40, category: 12, items: 40, location: 100, note: 200 };
const MAX_MINOR = 9999999;
const CATEGORIES = ['餐饮', '超市采购', '加油/充电', '住宿', '门票', '交通', '购物', '娱乐', '其他'];
const UNCATEGORISED = '其他';

// Calendar dates are plain YYYY-MM-DD strings, so they never shift with the time zone.
function todayISO() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function isValidISO(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
  return !!m && +m[2] >= 1 && +m[2] <= 12 && +m[3] >= 1 && +m[3] <= 31;
}
// "2026.11.14", "2026.11.14 – 11.15", or both dates in full across years.
function displayDate(iso) { return iso.replace(/-/g, '.'); }
function displayRange(start, end) {
  if (!end || end === start) return displayDate(start);
  if (start.slice(0, 4) !== end.slice(0, 4)) return displayDate(start) + ' – ' + displayDate(end);
  return displayDate(start) + ' – ' + displayDate(end.slice(5));
}

function formatMoney(minor) {
  const whole = String(Math.floor(minor / 100)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return '$' + whole + '.' + String(minor % 100).padStart(2, '0');
}

const AMOUNT_ERRORS = {
  empty: '请填写金额。',
  invalid: '请输入有效金额，例如 12.50。',
  negative: '金额不能为负数。',
  decimals: '最多保留两位小数。',
  range: '单项金额不能超过 $99,999.99。',
};

// One number, e.g. "12", "12.5", "$12.50". Returns { minor } or { error }.
function parseSingle(tok) {
  let s = tok, negative = false;
  const stripMinus = () => { if (/^[-−]/.test(s)) { negative = true; s = s.slice(1); } };
  stripMinus();
  if (/^[$＄]/.test(s)) s = s.slice(1);
  stripMinus();
  const m = /^(\d*)(?:\.(\d*))?$/.exec(s);
  if (!m || (m[1] === '' && !m[2])) return { error: 'invalid' };
  if (negative) return { error: 'negative' };
  const frac = m[2] || '';
  if (frac.length > 2) return { error: 'decimals' };
  const whole = m[1].replace(/^0+/, '');
  if (whole.length > 5) return { error: 'range' };
  return { minor: Number(whole || 0) * 100 + Number(frac.padEnd(2, '0')) };
}

// An amount may be several numbers to add up: "18.2, 20.1, 5" or "18.2+20.1+5".
// Commas (half- or full-width), "、", ";", "+" and spaces all mean "plus".
// Returns { minor, parts } or { error }.
function parseAmount(raw) {
  const tokens = String(raw).trim().split(/[+＋,，、;；\s]+/).filter(Boolean);
  if (!String(raw).trim()) return { error: 'empty' };
  if (!tokens.length) return { error: 'invalid' };
  const parts = [];
  for (const tok of tokens) {
    const one = parseSingle(tok);
    if (one.error) return one;
    parts.push(one.minor);
  }
  const minor = parts.reduce((a, b) => a + b, 0);
  if (minor > MAX_MINOR) return { error: 'range' };
  return { minor, parts };
}
const plainAmount = (minor) => (minor / 100).toFixed(2);

const len = (s) => Array.from(s).length;

// Tax or tip: an amount ("12.30") or a percentage of the subtotal ("8.25%"). Empty means none.
// Returns { minor, rate } where rate is the percentage as text ("8.25") or null, or { error }.
function parseExtra(raw, subtotal, maxPct) {
  const s = String(raw || '').trim().replace(/％/g, '%').replace(/\s+/g, '');
  if (!s) return { minor: 0, rate: null };
  if (s.endsWith('%')) {
    const m = /^(\d{1,3})(?:\.(\d{1,3}))?%$/.exec(s);
    if (!m) return { error: '百分比格式不对，例如 8.25%。' };
    const pct = Number(m[1] + '.' + (m[2] || '0'));
    if (pct > maxPct) return { error: '不能超过 ' + maxPct + '%。' };
    return { minor: Math.round(subtotal * pct / 100), rate: String(pct) };
  }
  const a = parseSingle(s);
  if (a.error) return { error: AMOUNT_ERRORS[a.error] };
  return { minor: a.minor, rate: null };
}
const TIP_PRESETS = ['15%', '18%', '20%'];

// Splitting a total that does not divide evenly. Each friend pays the same share and the payer
// covers the difference: to the cent (rounded up, so the payer is never short), rounded up to whole
// dollars, or rounded down to whole dollars (抹零, the payer treats everyone to the change).
const ROUNDING = { cent: '精确到分', up: '凑整到元', down: '抹零' };
const ROUNDING_ORDER = ['cent', 'up', 'down'];
function splitShare(total, people, mode) {
  if (!(people >= 2)) return total;
  const exact = total / people;
  if (mode === 'up') {
    const up = Math.ceil(exact / 100) * 100;
    return up * (people - 1) <= total ? up : Math.ceil(exact);
  }
  if (mode === 'down') { const down = Math.floor(exact / 100) * 100; return down > 0 ? down : Math.ceil(exact); }
  if (mode === 'cent') return Math.ceil(exact);
  return Math.round(exact); // receipts printed before rounding modes existed
}

// Getting paid back: a split receipt can carry the payer's account. Venmo, PayPal and Cash App get a
// QR code that opens a payment for the per-person amount; Zelle has no such link, so it is printed as text.
// WeChat and Alipay use the payer's own receive code: its screenshot is decoded once in the browser and
// the code is reprinted crisply. These codes carry no amount, so the friend types it in.
const PAY_METHODS = {
  venmo: { name: 'Venmo', prefix: '@', placeholder: '用户名' },
  paypal: { name: 'PayPal', prefix: 'paypal.me/', placeholder: '用户名' },
  cashapp: { name: 'Cash App', prefix: '$', placeholder: 'cashtag' },
  zelle: { name: 'Zelle', prefix: '', placeholder: '邮箱或手机号' },
  wechat: { name: '微信', code: /^wxp:\/\/\S+$/i },
  alipay: { name: '支付宝', code: /^https?:\/\/qr\.alipay\.com\/\S+$/i },
};
const PAY_ORDER = ['venmo', 'paypal', 'cashapp', 'zelle', 'wechat', 'alipay'];
// Which receive code a decoded QR is, if either.
function codeMethod(text) {
  for (const k of ['wechat', 'alipay']) if (PAY_METHODS[k].code.test(String(text || '').trim())) return k;
  return null;
}

// Accepts "@name", "$name" or a pasted profile link such as venmo.com/u/name or paypal.me/name.
function normalizeHandle(method, raw) {
  let h = String(raw || '').trim();
  if (method === 'zelle') return h;
  h = h.replace(/^https?:\/\//i, '').replace(/[?#].*$/, '').replace(/\/+$/, '');
  if (h.includes('/')) {
    const segs = h.split('/');
    // paypal.me/name/12.50 → name; venmo.com/u/name → name; cash.app/$name → name
    h = /paypal\.me$/i.test(segs[0]) ? segs[1] || '' : segs[segs.length - 1];
  }
  return h.replace(/^[@$]+/, '');
}
function handleError(method, h) {
  if (!h) return '请填写收款账号。';
  if (method === 'zelle') return len(h) > 60 ? '账号最多 60 个字符。' : null;
  return /^[A-Za-z0-9_.-]{1,30}$/.test(h) ? null : '用户名只能包含英文字母、数字、_ . -';
}
function payDisplay(pay) {
  const m = PAY_METHODS[pay.method];
  return m.code ? m.name : pay.method === 'zelle' ? pay.handle : m.prefix + pay.handle;
}
// The amount each friend pays (the total for an unsplit receipt).
function shareMinor(r) { return splitShare(r.totalMinor, r.people, r.rounding); }
// What the payer's own share comes to once every friend has paid their share.
function payerMinor(r) { return r.totalMinor - shareMinor(r) * (r.people - 1); }
// A link that opens the payment, prefilled with the amount where the method allows it; the receive
// code itself for WeChat and Alipay; null for Zelle.
function payLink(r) {
  const p = r.pay;
  if (!p || !PAY_METHODS[p.method] || p.method === 'zelle') return null;
  if (PAY_METHODS[p.method].code) return p.code || null;
  const amount = plainAmount(shareMinor(r));
  const h = encodeURIComponent(p.handle);
  // Keep the note short: every Chinese character costs 9 bytes in the URL and makes the QR denser.
  const note = encodeURIComponent(Array.from(r.title).slice(0, 16).join(''));
  if (p.method === 'venmo') return 'https://venmo.com/' + h + '?txn=pay&amount=' + amount + '&note=' + note;
  if (p.method === 'paypal') return 'https://paypal.me/' + h + '/' + amount + 'USD';
  if (p.method === 'cashapp') return 'https://cash.app/$' + h + '/' + amount;
  return null;
}

// The last account used is remembered, so the next split receipt starts with it filled in.
const PAY_KEY = 'receipts.pay.v1';
function loadPayPref() {
  try {
    const p = JSON.parse(localStorage.getItem(PAY_KEY));
    if (p && PAY_METHODS[p.method] && typeof p.handle === 'string') return { method: p.method, handle: p.handle, code: p.code || '' };
  } catch (e) { /* none saved */ }
  return { method: '', handle: '', code: '' };
}
function savePayPref(pay) {
  try { localStorage.setItem(PAY_KEY, JSON.stringify(pay)); } catch (e) { /* not critical */ }
}

// Who owes the payer: on a split receipt the payer is one of the people, so up to people − 1 names.
// Each has a paid tick, ticked off on the detail page; once everyone has paid the receipt gets a stamp.
const NAME_MAX = 12;
function participantsOf(r) { return Array.isArray(r.participants) ? r.participants : []; }
function owedCount(r) { return r.people >= 2 ? r.people - 1 : 0; }
function isSettled(r) {
  const p = participantsOf(r);
  return owedCount(r) > 0 && p.length === owedCount(r) && p.every((x) => x.paid);
}
// "小王, 小李、阿杰" → ['小王', '小李', '阿杰']
function splitNames(raw) { return String(raw || '').split(/[,，、;；\s]+/).map((s) => s.trim()).filter(Boolean); }
// Names used on earlier receipts, most recent first, so a regular group is a few taps away.
function recentNames() {
  const seen = new Set(), out = [];
  for (const r of state.receipts.slice().sort((a, b) => b.createdAt - a.createdAt)) {
    for (const p of participantsOf(r)) if (!seen.has(p.name)) { seen.add(p.name); out.push(p.name); }
  }
  return out;
}

// Error keys match form element ids: title, date, endDate, item-<row>, people, location, note.
// `focus` says which input of an item row the error belongs to.
function validate(draft) {
  const errors = {}, focus = {};
  const title = draft.title.trim();
  if (!title) errors.title = '请填写标题。';
  else if (len(title) > LIMITS.title) errors.title = '标题最多 60 个字符。';

  const start = draft.date || todayISO();
  if (!isValidISO(start)) errors.date = '请选择日期。';
  const end = draft.endDate && draft.endDate !== start ? draft.endDate : null;
  if (end && !isValidISO(end)) errors.endDate = '请选择有效的结束日期。';
  else if (end && end < start) errors.endDate = '结束日期不能早于开始日期。';

  // Rows left completely blank are ignored. A single item may go unnamed (a one-amount receipt).
  const rows = draft.items.map((it, i) => ({ i, name: it.name.trim(), amount: it.amount.trim(),
    category: (it.category || '').trim(), parts: it.parts || [] }));
  const filled = rows.filter((r) => r.name || r.amount);
  const items = [];
  const fail = (r, msg, where) => { errors['item-' + r.i] = msg; focus['item-' + r.i] = where; };
  if (!filled.length) fail(rows[0], AMOUNT_ERRORS.empty, 'amount');
  for (const r of filled) {
    const amount = parseAmount(r.amount);
    if (amount.error) fail(r, AMOUNT_ERRORS[amount.error], 'amount');
    else if (!r.name && (filled.length > 1 || r.category)) fail(r, '请填写项目名称。', 'name');
    else if (len(r.name) > LIMITS.itemName) fail(r, '项目名称最多 40 个字符。', 'name');
    else if (len(r.category) > LIMITS.category) fail(r, '分类最多 12 个字符。', 'name');
    else {
      // The addends are kept so the receipt can show how the amount was reached: either still
      // typed in the field, or remembered from when the field was collapsed to its sum.
      const remembered = r.parts.length > 1 && r.parts.reduce((a, b) => a + b, 0) === amount.minor;
      const parts = amount.parts.length > 1 ? amount.parts : remembered ? r.parts : [];
      items.push({ name: r.name, amountMinor: amount.minor, category: r.category, parts });
    }
  }

  // Splitting between people is optional and switched on in its own section.
  const peopleText = draft.split ? String(draft.people || '').trim() : '';
  let people = null;
  if (draft.split) {
    if (!/^\d{1,2}$/.test(peopleText) || Number(peopleText) < 2) errors.people = '人数请填 2 到 99。';
    else people = Number(peopleText);
  }

  const names = Array.from(new Set((draft.names || []).map((s) => s.trim()).filter(Boolean)));
  if (people && names.length > people - 1) errors.names = '名单最多 ' + (people - 1) + ' 人（' + people + ' 人里不含你自己），请删掉几个名字或改人数。';

  // A payment account is only printed on a split receipt.
  let pay = null;
  const method = draft.pay && PAY_METHODS[draft.pay.method] ? draft.pay.method : '';
  if (people && method && PAY_METHODS[method].code) {
    const code = String(draft.pay.code || '').trim();
    if (codeMethod(code) !== method) errors.pay = '请上传' + PAY_METHODS[method].name + '收款码截图。';
    else pay = { method, handle: '', code };
  } else if (people && method) {
    const handle = normalizeHandle(method, draft.pay.handle);
    const err = handleError(method, handle);
    if (err) errors.pay = err;
    else pay = { method, handle };
  }

  // Tax and tip, each an amount or a percentage of the items' subtotal (tip is usually on the pre-tax amount).
  const subtotal = items.reduce((sum, it) => sum + it.amountMinor, 0);
  const tax = parseExtra(draft.tax, subtotal, 30);
  if (tax.error) errors.tax = '税：' + tax.error;
  const tip = parseExtra(draft.tip, subtotal, 100);
  if (tip.error) errors.tip = '小费：' + tip.error;
  const rounding = ROUNDING[draft.rounding] ? draft.rounding : 'cent';

  const location = draft.location.trim();
  if (len(location) > LIMITS.location) errors.location = '地点最多 100 个字符。';
  const note = draft.note.trim();
  if (len(note) > LIMITS.note) errors.note = '备注最多 200 个字符。';

  if (Object.keys(errors).length) return { errors, focus };
  return { errors, focus, input: {
    title, purchaseDate: start, endDate: end, items,
    subtotalMinor: subtotal,
    taxMinor: tax.minor || 0, taxRate: tax.minor ? tax.rate : null,
    tipMinor: tip.minor || 0, tipRate: tip.minor ? tip.rate : null,
    totalMinor: subtotal + (tax.minor || 0) + (tip.minor || 0),
    people, rounding: people ? rounding : null, pay,
    participants: people && names.length ? names.map((name) => ({ name, paid: false })) : null,
    location: location || null, note: note || null, photo: draft.photo || null,
    style: THEMES[draft.style] ? draft.style : 'thermal',
  } };
}

// Items grouped by category in order of first appearance. With no categories at all there is
// one unnamed group; otherwise uncategorised items fall under "其他".
function groupItems(items) {
  if (!items.some((it) => it.category)) return [{ name: '', items, subtotal: 0 }];
  const groups = [];
  for (const it of items) {
    const name = it.category || UNCATEGORISED;
    let g = groups.find((x) => x.name === name);
    if (!g) { g = { name, items: [], subtotal: 0 }; groups.push(g); }
    g.items.push(it);
    g.subtotal += it.amountMinor;
  }
  return groups;
}

/* ---------- Storage ---------- */

// Receipts and the draft live in one localStorage value, so "save receipt + clear draft"
// is a single write: it either fully happens or not at all.
const KEY = 'receipts.v1';
const FAIL_SAVE = new URLSearchParams(location.search).has('failsave'); // QA hook

function newDraft(style) {
  const id = (crypto.randomUUID && crypto.randomUUID()) ||
    Array.from(crypto.getRandomValues(new Uint8Array(16)), (b) => b.toString(16).padStart(2, '0')).join('');
  return { id, title: '', date: null, endDate: null, items: [{ name: '', amount: '', category: '', parts: [] }],
    split: false, people: '', names: [], rounding: 'cent', tax: '', tip: '', pay: loadPayPref(), location: '', note: '', photo: null, style: style || 'thermal' };
}

// Receipts and drafts saved by earlier versions had one merchant and one amount, and no style.
function upgradeReceipt(r) {
  const out = Object.assign({ style: 'thermal', people: null }, r);
  if (!Array.isArray(r.items)) Object.assign(out, {
    title: r.merchant, items: [{ name: '', amountMinor: r.amountMinor }], totalMinor: r.amountMinor,
    endDate: null, photo: null,
  });
  return out;
}
function upgradeDraft(d) {
  if (!d) return newDraft();
  if (Array.isArray(d.items) && d.items.length) {
    // Drafts from before the AA switch: a head count of 2 or more meant splitting.
    const split = typeof d.split === 'boolean' ? d.split : Number(d.people) >= 2;
    return Object.assign({ style: 'thermal', people: '', names: [], rounding: 'cent', tax: '', tip: '', pay: loadPayPref() }, d, { split },
      { items: d.items.map((it) => Object.assign({ category: '', parts: [] }, it)) });
  }
  return Object.assign(newDraft(), {
    id: d.id, title: d.merchant || '', date: d.date || null,
    items: [{ name: '', amount: d.amount || '', category: '', parts: [] }], location: d.location || '', note: d.note || '',
  });
}

function loadState() {
  try {
    const raw = JSON.parse(localStorage.getItem(KEY));
    if (raw && Array.isArray(raw.receipts)) return { receipts: raw.receipts.map(upgradeReceipt), draft: upgradeDraft(raw.draft) };
  } catch (e) { /* unreadable storage: start empty */ }
  return { receipts: [], draft: newDraft() };
}

let state = loadState();

function write(next) {
  localStorage.setItem(KEY, JSON.stringify(next));
  state = next;
}

// Newest start date first; within a day, newest created first.
function sorted(receipts) {
  return receipts.slice().sort((a, b) =>
    a.purchaseDate < b.purchaseDate ? 1 : a.purchaseDate > b.purchaseDate ? -1 : b.createdAt - a.createdAt);
}

function saveDraft(draft) {
  state.draft = draft;
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* keep in memory */ }
}

// Receipt number printed on the paper, like a till receipt: print date plus eight digits derived
// from the receipt's unique ID, e.g. 261116-4827-0193. Stable for a given receipt.
function receiptNo(id, createdAt) {
  const d = new Date(createdAt || 0);
  const two = (n) => String(n).padStart(2, '0');
  const digits = String(hash32(id) % 100000000).padStart(8, '0');
  return String(d.getFullYear()).slice(2) + two(d.getMonth() + 1) + two(d.getDate()) + '-' + digits.slice(0, 4) + '-' + digits.slice(4);
}

// The receipt takes the draft's ID, so retrying one submission can never create a second receipt.
function commit(input) {
  if (FAIL_SAVE) throw new Error('simulated save failure');
  const id = state.draft.id;
  const existing = state.receipts.find((r) => r.id === id);
  const now = new Date();
  const receipt = existing || Object.assign({
    id, currency: 'USD', createdAt: now.getTime(), templateVersion: 4,
    no: receiptNo(id, now.getTime()),
    printedAt: String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0'),
  }, input);
  if (!existing && receipt.pay) savePayPref(receipt.pay);
  // The next draft starts in the style just used.
  write({ receipts: sorted(existing ? state.receipts : state.receipts.concat(receipt)), draft: newDraft(receipt.style) });
  return receipt;
}

function removeReceipt(id) {
  write({ receipts: state.receipts.filter((r) => r.id !== id), draft: state.draft });
  thumbs.delete(id);
}

function restyleReceipt(id, style) {
  updateReceipt(id, { style });
}
function updateReceipt(id, change) {
  write({ receipts: state.receipts.map((r) => r.id === id ? Object.assign({}, r, change) : r), draft: state.draft });
  thumbs.delete(id);
}

/* ---------- Photo ---------- */
// A photo is reduced in the browser to a small greyscale bitmap (about 16 KB) and the original is
// discarded. Each receipt style then prints that bitmap in its own way: dithered dots, halftone,
// line screen, two-colour print, a taped snapshot, or four shades of green.

const PHOTO_W = 126;          // bitmap width; most styles draw it at 2 receipt pixels per dot
const PHOTO_MAX_RATIO = 1.25; // taller photos are centre-cropped

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('unreadable image')); };
    img.src = url;
  });
}

async function photoFromFile(file) {
  const img = await loadImage(file);
  const iw = img.naturalWidth, ih = img.naturalHeight;
  if (!iw || !ih) throw new Error('empty image');
  const ratio = Math.min(ih / iw, PHOTO_MAX_RATIO);
  const w = PHOTO_W, h = Math.max(8, Math.round(w * ratio));
  const srcH = iw * ratio, srcY = (ih - srcH) / 2;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, 0, srcY, iw, srcH, 0, 0, w, h);
  const rgba = ctx.getImageData(0, 0, w, h).data;

  // Greyscale, then stretch contrast between the 2nd and 98th percentiles.
  const grey = new Float32Array(w * h);
  const hist = new Uint32Array(256);
  for (let i = 0; i < grey.length; i++) {
    const v = 0.299 * rgba[i * 4] + 0.587 * rgba[i * 4 + 1] + 0.114 * rgba[i * 4 + 2];
    grey[i] = v; hist[Math.round(v)]++;
  }
  let lo = 0, hi = 255, acc = 0;
  for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc >= grey.length * 0.02) { lo = v; break; } }
  acc = 0;
  for (let v = 255; v >= 0; v--) { acc += hist[v]; if (acc >= grey.length * 0.02) { hi = v; break; } }
  const span = Math.max(1, hi - lo);
  let binary = '';
  for (let i = 0; i < grey.length; i++) {
    binary += String.fromCharCode(Math.round(Math.min(255, Math.max(0, (grey[i] - lo) * 255 / span))));
  }
  return { w, h, gray: btoa(binary) };
}

// Grey values 0–255. Photos saved by the first version only kept dark/light bits.
function photoGray(photo) {
  const g = new Float32Array(photo.w * photo.h);
  if (photo.gray) {
    const binary = atob(photo.gray);
    for (let i = 0; i < g.length; i++) g[i] = binary.charCodeAt(i);
  } else {
    const binary = atob(photo.bits);
    for (let i = 0; i < g.length; i++) g[i] = ((binary.charCodeAt(i >> 3) >> (i & 7)) & 1) ? 0 : 255;
  }
  return g;
}

// Atkinson dithering to `levels` evenly spaced tones. Returns a tone index per pixel (0 = darkest).
function atkinson(src, w, h, levels) {
  const g = Float32Array.from(src);
  const out = new Uint8Array(w * h);
  const stepSize = 255 / (levels - 1);
  const spread = [[1, 0], [2, 0], [-1, 1], [0, 1], [1, 1], [0, 2]];
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = y * w + x;
      const idx = Math.min(levels - 1, Math.max(0, Math.round(g[i] / stepSize)));
      out[i] = idx;
      const err = (g[i] - idx * stepSize) / 8;
      for (const [dx, dy] of spread) {
        const nx = x + dx, ny = y + dy;
        if (nx >= 0 && nx < w && ny < h) g[ny * w + nx] += err;
      }
    }
  }
  return out;
}

const BAYER4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];

// Fills horizontal runs of pixels whose tone index equals `tone`.
function fillTone(ctx, idx, w, h, tone, x0, y0, px) {
  for (let y = 0; y < h; y++) {
    let start = -1;
    for (let x = 0; x <= w; x++) {
      const on = x < w && idx[y * w + x] === tone;
      if (on && start < 0) start = x;
      if (!on && start >= 0) { ctx.fillRect(x0 + start * px, y0 + y * px, (x - start) * px, px); start = -1; }
    }
  }
}

function photoHeight(T, photo, inner) {
  if (T.photo === 'polaroid') return photo.h * (inner - 24) / photo.w + 12 + 30 + 12;
  if (T.photo === 'gameboy') return Math.floor(photo.h / 2) * (inner / Math.floor(photo.w / 2));
  return photo.h * inner / photo.w;
}

// Prints a photo in the style's own manner. `ink` is the ink layer (gets the uneven-print wear);
// `paper` is the paper layer, used by styles whose photo is an object on the page, not ink.
function paintPhoto(ink, paper, T, photo, x0, y0, inner, seed) {
  const w = photo.w, h = photo.h, px = inner / w;
  const g = photoGray(photo);
  ink.fillStyle = T.ink;

  if (T.photo === 'bayer') {
    // Ordered dither: a regular woven texture, like a rubber stamp.
    const idx = new Uint8Array(w * h);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      idx[y * w + x] = g[y * w + x] < (BAYER4[(y & 3) * 4 + (x & 3)] + 0.5) * 16 ? 0 : 1;
    }
    fillTone(ink, idx, w, h, 0, x0, y0, px);
  } else if (T.photo === 'riso') {
    // Two-colour print: darks in the main ink, mid-tones in the accent colour.
    const idx = atkinson(g, w, h, 3);
    fillTone(ink, idx, w, h, 0, x0, y0, px);
    ink.fillStyle = T.accent;
    fillTone(ink, idx, w, h, 1, x0, y0, px);
  } else if (T.photo === 'invert') {
    // Dark paper: the light parts of the picture are what gets inked.
    fillTone(ink, atkinson(g, w, h, 2), w, h, 1, x0, y0, px);
  } else if (T.photo === 'halftone') {
    // Newspaper halftone: dots on a staggered grid, bigger where the picture is darker.
    const cell = 3;
    ink.save();
    ink.beginPath(); ink.rect(x0, y0, w * px, h * px); ink.clip();
    for (let row = 0, cy = 0; cy < h; row++, cy += cell) {
      for (let cx = (row % 2) * cell / 2 - cell / 2; cx < w; cx += cell) {
        let sum = 0, n = 0;
        for (let yy = cy; yy < Math.min(h, cy + cell); yy++) {
          for (let xx = Math.max(0, Math.floor(cx)); xx < Math.min(w, Math.floor(cx) + cell); xx++) { sum += g[yy * w + xx]; n++; }
        }
        if (!n) continue;
        const dark = 1 - sum / n / 255;
        if (dark < 0.05) continue;
        ink.beginPath();
        ink.arc(x0 + (cx + cell / 2) * px, y0 + (cy + cell / 2) * px, cell * px * 0.56 * Math.sqrt(dark), 0, Math.PI * 2);
        ink.fill();
      }
    }
    ink.restore();
  } else if (T.photo === 'lines') {
    // Line screen: horizontal lines that swell with the tone, like a technical plot.
    const cell = 2;
    for (let cy = 0; cy < h; cy += cell) {
      for (let x = 0; x < w; x++) {
        const v = (g[cy * w + x] + g[Math.min(h - 1, cy + 1) * w + x]) / 2 / 255;
        const amount = T.dark ? v : 1 - v;
        const th = cell * px * 0.92 * amount;
        if (th < 0.35) continue;
        ink.fillRect(x0 + x * px, y0 + cy * px + (cell * px - th) / 2, px + 0.05, th);
      }
    }
  } else if (T.photo === 'polaroid') {
    // A greyscale snapshot taped to the page at a slight angle.
    const s = (inner - 24) / w, pw = w * s, ph = h * s, fw = pw + 24, fh = ph + 12 + 30;
    const tmp = document.createElement('canvas');
    tmp.width = w; tmp.height = h;
    const tctx = tmp.getContext('2d');
    const data = tctx.createImageData(w, h);
    for (let i = 0; i < g.length; i++) {
      data.data[i * 4] = g[i] * 0.96 + 8; data.data[i * 4 + 1] = g[i] * 0.95 + 6; data.data[i * 4 + 2] = g[i] * 0.92 + 4; data.data[i * 4 + 3] = 255;
    }
    tctx.putImageData(data, 0, 0);
    const tilt = (rng(seed ^ 0x9e3779b9)() - 0.5) * 0.07;
    paper.save();
    paper.translate(W / 2, y0 + 6 + fh / 2);
    paper.rotate(tilt);
    paper.shadowColor = 'rgba(0,0,0,0.22)'; paper.shadowBlur = 8; paper.shadowOffsetY = 2;
    paper.fillStyle = '#fffefb'; paper.fillRect(-fw / 2, -fh / 2, fw, fh);
    paper.shadowColor = 'transparent';
    paper.imageSmoothingEnabled = true; paper.imageSmoothingQuality = 'high';
    paper.drawImage(tmp, -pw / 2, -fh / 2 + 12, pw, ph);
    paper.rotate(-0.05);
    paper.fillStyle = 'rgba(238,196,92,0.6)'; paper.fillRect(-36, -fh / 2 - 8, 72, 18);
    paper.restore();
  } else if (T.photo === 'gameboy') {
    // Four shades of green in chunky pixels.
    const w2 = Math.floor(w / 2), h2 = Math.floor(h / 2), big = inner / w2;
    const shades = ['#0f380f', '#306230', '#8bac0f', '#c5d68b'];
    paper.fillStyle = shades[3]; paper.fillRect(x0, y0, w2 * big, h2 * big);
    const idx = new Uint8Array(w2 * h2);
    for (let y = 0; y < h2; y++) for (let x = 0; x < w2; x++) {
      const v = (g[2 * y * w + 2 * x] + g[2 * y * w + 2 * x + 1] + g[(2 * y + 1) * w + 2 * x] + g[(2 * y + 1) * w + 2 * x + 1]) / 4;
      idx[y * w2 + x] = Math.min(3, Math.max(0, Math.round(v / 85 + (BAYER4[(y & 3) * 4 + (x & 3)] + 0.5) / 16 - 0.5)));
    }
    for (let tone = 0; tone < 3; tone++) { paper.fillStyle = shades[tone]; fillTone(paper, idx, w2, h2, tone, x0, y0, big); }
    paper.strokeStyle = shades[0]; paper.lineWidth = 2; paper.strokeRect(x0 - 1, y0 - 1, w2 * big + 2, h2 * big + 2);
  } else {
    // Thermal print: crisp black dots.
    fillTone(ink, atkinson(g, w, h, 2), w, h, 0, x0, y0, px);
  }
}

};
const THEME_ORDER = ['thermal', 'kraft', 'ticket', 'midnight', 'notebook', 'blueprint', 'newsprint', 'gameboy'];

function hash32(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return h >>> 0;
}
function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const CJK = /[⺀-鿿가-힯豈-﫿＀-￯　-ヿ]/;

// Greedy wrap: breaks at spaces, between CJK characters, and inside words too long for a line.
function wrap(ctx, text, maxWidth) {
  const lines = [];
  for (const para of String(text).split('\n')) {
    const tokens = [];
    let word = '';
    for (const ch of Array.from(para)) {
      if (ch === ' ' || CJK.test(ch)) { if (word) { tokens.push(word); word = ''; } tokens.push(ch); }
      else word += ch;
    }
    if (word) tokens.push(word);

    let line = '';
    const push = () => { lines.push(line.replace(/\s+$/, '')); line = ''; };
    for (const tok of tokens) {
      if (ctx.measureText(line + tok).width <= maxWidth) { line += tok; continue; }
      if (line.trim()) push(); else line = '';
      if (tok === ' ') continue;
      if (ctx.measureText(tok).width <= maxWidth) { line = tok; continue; }
      for (const ch of Array.from(tok)) {
        if (line && ctx.measureText(line + ch).width > maxWidth) push();
        line += ch;
      }
    }
    push();
  }
  return lines;
}

// Paper outline. Top and bottom edges depend on the style; ticket stubs get a notch on each side,
// notebook pages get punched holes (added as extra sub-paths and cut out with the even-odd rule).
function paperPath(ctx, T, H, rand, notchY) {
  const PI = Math.PI;
  const n = Math.floor(W / 14), step = W / n;
  ctx.beginPath();
  if (T.top === 'zig') {
    ctx.moveTo(0, 4);
    let up = true;
    for (let x = 5; x <= W; x += 5) { ctx.lineTo(x, up ? 0 : 4); up = !up; }
  } else if (T.top === 'scallop') {
    ctx.moveTo(0, 0);
    for (let i = 0; i < n; i++) { const cx = (i + 0.5) * step; ctx.lineTo(cx - 5, 0); ctx.arc(cx, 0, 5, PI, 0, true); }
    ctx.lineTo(W, 0);
  } else { ctx.moveTo(0, 0); ctx.lineTo(W, 0); }

  if (notchY) { ctx.lineTo(W, notchY - 7); ctx.arc(W, notchY, 7, -PI / 2, PI / 2, true); }

  if (T.bottom === 'zig') {
    let up = false;
    for (let x = W; x >= 0; x -= 5) { ctx.lineTo(x, up ? H : H - 4); up = !up; }
  } else if (T.bottom === 'scallop') {
    ctx.lineTo(W, H);
    for (let i = n - 1; i >= 0; i--) { const cx = (i + 0.5) * step; ctx.lineTo(cx + 5, H); ctx.arc(cx, H, 5, 0, PI, true); }
    ctx.lineTo(0, H);
  } else if (T.bottom === 'flat') {
    ctx.lineTo(W, H); ctx.lineTo(0, H);
  } else {
    ctx.lineTo(W, H - 2);
    let x = W, notch = true;
    while (x > 0) {
      x = Math.max(0, x - 4.5 * (0.8 + rand() * 0.5));
      ctx.lineTo(x, notch ? H - 5 - rand() * 2 : H - rand() * 1.5);
      notch = !notch;
    }
  }

  if (notchY) { ctx.lineTo(0, notchY + 7); ctx.arc(0, notchY, 7, PI / 2, -PI / 2, true); }
  ctx.closePath();

  if (T.holes) {
    for (let hy = 26; hy < H - 14; hy += 30) { ctx.moveTo(16.5, hy); ctx.arc(12, hy, 4.5, 0, PI * 2); }
  }
}

function drawReceipt(r, scale) {
  scale = scale || Math.min(3, Math.max(2, window.devicePixelRatio || 1));
  const T = THEMES[r.style] || THEMES.thermal;
  const F = T.font;
  const SMALL = F === SERIF ? SERIF : MONO; // fine print
  const inner = W - PAD_X * 2;
  const measure = document.createElement('canvas').getContext('2d');
  const ops = [];
  let y = T.padTop;
  let bandBottom = 0;

  const text = (str, font, lineH, align, opts) => {
    opts = opts || {};
    measure.font = font;
    const lines = opts.noWrap ? [str] : wrap(measure, str, opts.width || inner);
    for (const ln of lines) {
      ops.push({ t: 'text', str: ln, font, align, y: y + lineH / 2, spacing: opts.spacing || 0,
        alpha: opts.alpha || 1, color: opts.color || 'ink' });
      y += lineH;
    }
  };
  const rule = () => { ops.push({ t: 'rule', y: y + 0.5 }); y += T.rule === 'double' ? 4 : 1; };
  const bar = (h) => { ops.push({ t: 'bar', y, h }); y += h; };
  const photo = () => { ops.push({ t: 'photo', photo: r.photo, y }); y += photoHeight(T, r.photo, inner); };

  // Header: title, date or date range, optional place, optional photo.
  const onBand = T.band ? 'paper' : 'ink';
  const titleSize = T.titleSize || 22;
  if (T.masthead) { bar(3); y += 3; bar(1); y += 12; }
  text(r.title, 'bold ' + titleSize + 'px ' + F, titleSize + 7, 'center', { color: onBand });
  y += T.band ? 6 : 10;
  text(displayRange(r.purchaseDate, r.endDate), '12px ' + F, 16, 'center', { spacing: 1, noWrap: true, color: onBand, alpha: T.band ? 0.92 : 1 });
  if (T.masthead) { y += 10; bar(1); }
  if (T.band) {
    // Ticket: the header sits on a coloured band that takes the place of the first rule.
    bandBottom = y + 16;
    y = bandBottom + 16;
    if (r.location) { text(r.location, '12px ' + F, 17, 'center'); y += 10; }
    if (r.photo) { photo(); y += 16; }
    y -= 14;
  } else {
    if (r.location) { y += T.masthead ? 10 : 5; text(r.location, '12px ' + F, 17, 'center'); }
    if (r.photo) { y += 18; photo(); }

  }

  // Line items, grouped under category headings when categories are used.
  // A lone unnamed item is just the total, so the list is skipped.
  const itemised = !(r.items.length === 1 && !r.items[0].name);
  if (itemised) {
    const itemFont = '13px ' + F;
    measure.font = itemFont;
    const amountW = Math.max(...r.items.map((it) => measure.measureText(formatMoney(it.amountMinor)).width));
    const nameW = inner - amountW - 12;
    y += 14;
    groupItems(r.items).forEach((g, gi) => {
      if (gi) y += 14;
      if (g.name) {
        if (g.items.length > 1) {
          ops.push({ t: 'text', str: formatMoney(g.subtotal), font: '11px ' + F, align: 'right', y: y + 9, spacing: 0, alpha: 0.75, color: 'accent' });
        }
        text(g.name, 'bold 12px ' + F, 18, 'left', { color: 'accent', spacing: 1, noWrap: true });
        y += 4;
      }
      g.items.forEach((it, i) => {
        if (i) y += 7;
        ops.push({ t: 'text', str: formatMoney(it.amountMinor), font: itemFont, align: 'right', y: y + 9, spacing: 0, alpha: 1, color: 'ink' });
        text(it.name, itemFont, 18, 'left', { width: nameW });
        // An amount entered as a sum shows its addends, like a till listing each charge.
        if (it.parts && it.parts.length > 1) {
          text(it.parts.map(plainAmount).join(' + '), '10.5px ' + SMALL, 14, 'left', { width: nameW, alpha: 0.62 });
        }
      });
    });
    y += 14; rule();
  }

  // Subtotal, tax and tip, when there is tax or tip, as on a restaurant bill.
  if (r.taxMinor || r.tipMinor) {
    y += 14;
    const line = (label, minor) => {
      ops.push({ t: 'text', str: formatMoney(minor), font: '13px ' + F, align: 'right', y: y + 9, spacing: 0, alpha: 0.85, color: 'ink' });
      text(label, '13px ' + F, 18, 'left', { alpha: 0.85, noWrap: true });
      y += 4;
    };
    line('小计', r.subtotalMinor);
    if (r.taxMinor) line('税' + (r.taxRate ? ' ' + r.taxRate + '%' : ''), r.taxMinor);

  }

    if (measure.measureText(total).width <= inner - 64) break;
  }
  const totalY = y + 17;
  ops.push({ t: 'text', str: '合计', font: '600 14px ' + F, align: 'left', y: totalY + 2, spacing: 3, alpha: 1, color: 'ink' });
  ops.push({ t: 'text', str: total, font: 'bold ' + size + 'px ' + F, align: 'right', y: totalY, spacing: 0, alpha: 1, color: T.totalColor || 'ink' });

    y += 8;
    ops.push({ t: 'text', str: formatMoney(shareMinor(r)), font: 'bold 15px ' + F, align: 'right', y: y + 10, spacing: 0, alpha: 1, color: 'ink' });
    const tag = r.rounding === 'up' ? ' · 凑整' : r.rounding === 'down' ? ' · 抹零' : '';
    text('人均 · ' + r.people + ' 人' + tag, '12px ' + F, 20, 'left', { spacing: 1, alpha: 0.85, noWrap: true });
    // When the total does not divide evenly, show how it adds up: friends' shares plus the payer's.
    if (r.rounding && shareMinor(r) * r.people !== r.totalMinor) {
      text((r.people - 1) + ' × ' + formatMoney(shareMinor(r)) + ' + 你 ' + formatMoney(payerMinor(r)), '10.5px ' + SMALL, 14, 'right', { alpha: 0.62, noWrap: true });

  if (participants.length) {
    y += 10;
    const nameFont = '12px ' + F;

    const colW = inner / 2;
    participants.forEach((p, i) => {
      const x = PAD_X + (i % 2) * colW;

      let name = p.name;
      while (name.length > 1 && measure.measureText(name).width > colW - 22) name = name.slice(0, -1);

  y += 18;

  // Getting paid back: a QR code that opens the payment for the per-person amount.
  if (r.pay && PAY_METHODS[r.pay.method]) {

    const link = payLink(r);
    let qr = null;
